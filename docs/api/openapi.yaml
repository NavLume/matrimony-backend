openapi: 3.1.0
info:
  title: Matrimony API
  version: 0.1.0
  description: |
    The machine-readable API contract: every route, field and error code. The frontend
    generates its TypeScript types from this file (`npm run api:types` in the frontend repo),
    so keep it exact and keep it short.

    What each feature does, which endpoints it has and which frontend feature uses them is
    described phase by phase in the backend tracker, not here:
    https://claude.ai/artifact/RzGP4ky7jbKQMoUVA2WFYw

    Rules for every route: the agency comes from the request `Host` header (an allowlisted
    hostname; `X-Forwarded-Host` is ignored), except for `/health/*`. Every response is
    `cache-control: no-store`. Errors use `{ error: { code, requestId, details? } }`.
servers:
  - url: /
tags:
  - name: Health
  - name: Matches
  - name: Activity
  - name: Guardians
  - name: Verification
  - name: Meetings
  - name: Tenant
  - name: Auth
  - name: Registration
  - name: Session handoff
  - name: Account
  - name: My profile
  - name: My photos
  - name: CV
  - name: Review queue
  - name: Clients
  - name: Matches
  - name: Connections
  - name: Staff

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Process liveness
      description: Public. No agency needed.
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /health/ready:
    get:
      tags: [Health]
      summary: PostgreSQL and Redis availability
      description: Public. No agency needed.
      responses:
        '200':
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: unavailable }

  /api/v1/public/tenant:
    get:
      tags: [Tenant]
      summary: Public configuration of the agency for this hostname
      description: Public. Branding and public content only, never secrets.
      responses:
        '200':
          description: The active agency for the request hostname.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }

  /api/v1/public/agency-by-code:
    get:
      tags: [Mobile app]
      summary: Find an agency by the short code typed in the mobile app
      description: |
        Public, no agency hostname needed, 20 per minute per client address. The code is 4 to 12
        letters or digits, in either case. The answer gives the agency's public look and the
        `hostname` the app then uses for every other request (the agency is chosen by hostname,
        as on the website). The internal agency id is never given out.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9]{4,12}$' } }
      responses:
        '200':
          description: The agency that has this code.
          content:
            application/json:
              schema:
                type: object
                required: [code, hostname, name, locale, content]
                properties:
                  code: { type: string, example: MSBD }
                  hostname: { type: string, example: msbd.example.com }
                  name: { type: string }
                  locale: { type: string, enum: [bn, en] }
                  content: { type: object, description: Same public content as /public/tenant. }
        '400': { $ref: '#/components/responses/Error400' }
        '404':
          description: No agency has this code (`AGENCY_CODE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/public/app-version:
    get:
      tags: [Mobile app]
      summary: Whether this version of the mobile app may still be used
      description: |
        Public, no agency hostname needed. The minimum and latest versions and the store
        addresses are set per platform in the backend's configuration. With nothing set every
        version is supported.
      parameters:
        - { name: platform, in: query, required: true, schema: { type: string, enum: [ios, android] } }
        - { name: version, in: query, required: true, schema: { type: string, pattern: '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$' }, description: major.minor.patch }
      responses:
        '200':
          description: The rule for this platform and version.
          content:
            application/json:
              schema:
                type: object
                required: [supported, updateAvailable, minimumVersion, latestVersion, storeUrl]
                properties:
                  supported: { type: boolean, description: false means the app must be updated before use. }
                  updateAvailable: { type: boolean }
                  minimumVersion: { type: string }
                  latestVersion: { type: [string, 'null'] }
                  storeUrl: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error400' }

  /api/v1/auth/device/login:
    post:
      tags: [Mobile app]
      summary: Sign in from the mobile app with an email or phone number and a password
      description: |
        Public, 10 per minute per client address. The same checks, pause and answers as
        `/auth/login`, but no cookie is set and no Origin or CSRF header is needed. The answer
        carries a refresh token, and the session lasts `DEVICE_SESSION_TTL_SECONDS` (30 days by
        default). Send the request to the agency's `hostname` (see `/public/agency-by-code`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string, description: Keep in the phone's secure storage. Changes on every renewal. }
                  expiresIn: { type: integer }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/device/refresh:
    post:
      tags: [Mobile app]
      summary: Renew the app's access token
      description: |
        Public, 10 per minute. Returns a new access token and a new refresh token; the old refresh
        token stops working. Presenting one that was already used ends the whole session (401
        `SESSION_INVALID`), because only a copy of it can be presented twice. 409
        `REFRESH_UNAVAILABLE` means another renewal is running; try again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Renewed.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string, description: Keep in the phone's secure storage. Changes on every renewal. }
                  expiresIn: { type: integer }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/v1/auth/device/logout:
    post:
      tags: [Mobile app]
      summary: Sign out of the mobile app
      description: Public. Ends the session at once. A token that is wrong or already out of date does nothing and is not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Signed out. }
        '400': { $ref: '#/components/responses/Error400' }

  /api/v1/auth/device/phone/start:
    post:
      tags: [Mobile app]
      summary: Send a sign-in code to a phone number, from the mobile app
      description: Same as `/auth/phone/start` (same limits and answers) without the Origin requirement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneStartInput' }
      responses:
        '202': { description: A code was sent (or would have been). }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/device/phone/verify:
    post:
      tags: [Mobile app]
      summary: Sign in from the mobile app with a phone code
      description: |
        Same checks as `/auth/phone/verify`. A number with no account answers 202 with a
        `signupToken` (valid 10 minutes) to finish with `/auth/device/phone/signup`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneVerifyInput' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string, description: Keep in the phone's secure storage. Changes on every renewal. }
                  expiresIn: { type: integer }
        '202':
          description: The number has no account yet; nothing is created until the signup step.
          content:
            application/json:
              schema:
                type: object
                required: [status, signupToken]
                properties:
                  status: { type: string, const: signup_required }
                  signupToken: { type: string }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { description: Another renewal is running (`REFRESH_UNAVAILABLE`), or the number has no account (`REGISTRATION_REQUIRED`). }

  /api/v1/me/delete-account:
    post:
      tags: [Account]
      summary: Delete my account (members only)
      description: |
        Bearer token, members only, 5 per 10 minutes. The password is asked again (wrong ones count
        toward the sign-in pause). The profile is hidden at once, open requests are withdrawn and
        every session ends. The person has 14 days to change their mind: signing in again cancels
        the deletion. After that everything personal is erased (name, details, contacts, photos,
        CV, email, phone, password) and a bare history stays (member code, dates, status history,
        who approved what, that connections happened). 409 `PASSWORD_REQUIRED` for an account that
        has no password (a Google-only member sets one with the forgot-password link first).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string }
      responses:
        '202':
          description: Deletion scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [scheduledFor]
                properties:
                  scheduledFor: { type: string, format: date-time, description: When everything is erased unless the person signs in again. }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { description: The account has no password (`PASSWORD_REQUIRED`) or cannot be deleted now (`DELETION_NOT_POSSIBLE`). }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/device/register:
    post:
      tags: [Mobile app]
      summary: Start registering by email, from the mobile app
      description: |
        Same as `/auth/register` (same body, limits and answers) without the Origin requirement.
        The emailed link opens the website's confirm page, which finishes the step there; the person
        then signs in to the app.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '202': { description: A link was emailed (or would have been). }
        '400': { $ref: '#/components/responses/Error400' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/device/password/forgot:
    post:
      tags: [Mobile app]
      summary: Ask for a password reset link, from the mobile app
      description: Same as `/auth/password/forgot` without the Origin requirement. The link opens the website's reset page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string }
      responses:
        '202': { description: Always, whether or not the address has an account. }
        '400': { $ref: '#/components/responses/Error400' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/device/phone/signup:
    post:
      tags: [Mobile app]
      summary: Finish registering by phone, from the mobile app
      description: |
        Same as `/auth/phone/signup` with the `signupToken` from `/auth/device/phone/verify` in the
        body in place of the cookie. Creates the member and signs in like `/auth/device/login`.
        400 `LINK_INVALID_OR_EXPIRED` when the token is used or expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/PhoneSignupInput' }
                - type: object
                  required: [signupToken]
                  properties:
                    signupToken: { type: string }
      responses:
        '200':
          description: Registered and signed in.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer }
        '400': { $ref: '#/components/responses/Error400' }
        '409': { description: An account for the number appeared meanwhile (`PHONE_RETRY`). }

  /api/v1/me/push-devices:
    post:
      tags: [Mobile app]
      summary: Register this phone for push notifications
      description: |
        Bearer token, any signed-in account, 30 per 10 minutes. Call after sign-in with the token from
        the phone's push service. A token seen again moves to the account that registered it last. The
        push text is generic and names only the kind of event; the app reads the real line from the
        inbox. Nothing is sent unless the backend has a push sender configured (`PUSH_DRIVER`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              additionalProperties: false
              properties:
                platform: { type: string, enum: [ios, android] }
                token: { type: string, minLength: 20, maxLength: 4096 }
                locale: { type: string, enum: [bn, en], default: bn }
      responses:
        '204': { description: Registered. }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
    delete:
      tags: [Mobile app]
      summary: Stop push notifications to this phone
      description: Bearer token. Call on sign-out or when the person turns notifications off. Always 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        '204': { description: Removed (or was not registered). }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/v1/me/verification:
    get:
      tags: [Verification]
      summary: My verification (members)
      description: Whether my profile carries the Verified mark, and my latest request.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
    put:
      tags: [Verification]
      summary: Send an identity document
      description: |
        The request body is the file itself (PDF, JPEG or PNG, up to 5 MB) and the `X-Document-Type`
        header says what it is. The document is private and is deleted when the request is decided.
        409 `VERIFICATION_PENDING`, `ALREADY_VERIFIED` or `PROFILE_CLOSED`; 422 `DOCUMENT_INVALID` when
        the bytes are not the type claimed.
      security:
        - bearerAuth: []
      parameters:
        - { name: X-Document-Type, in: header, required: true, schema: { $ref: '#/components/schemas/DocumentType' } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: The state, with the request waiting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '413': { description: The file is too large. }
    delete:
      tags: [Verification]
      summary: Take my waiting request back
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '404': { description: Nothing is waiting (`VERIFICATION_NOT_FOUND`). }

  /api/v1/staff/verifications:
    get:
      tags: [Verification]
      summary: Requests waiting for a decision (staff)
      description: Oldest first. An agent sees those of their own clients, an admin all.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The waiting requests.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VerificationWaiting' }

  /api/v1/staff/clients/{profileId}/verification:
    get:
      tags: [Verification]
      summary: A client's verification (staff)
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
    put:
      tags: [Verification]
      summary: Send an identity document for a client (staff)
      description: Same as the member's call. The request is decided by someone else (an admin may decide their own).
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Document-Type, in: header, required: true, schema: { $ref: '#/components/schemas/DocumentType' } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
    delete:
      tags: [Verification]
      summary: Take a waiting request back (staff)
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }

  /api/v1/staff/clients/{profileId}/verification/document:
    get:
      tags: [Verification]
      summary: Open the waiting document (staff)
      description: Opening it is recorded in the event log. 404 `VERIFICATION_NOT_FOUND` once the request is decided.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }

  /api/v1/staff/clients/{profileId}/verification/approve:
    post:
      tags: [Verification]
      summary: Approve the waiting request
      description: The profile now carries the Verified mark. 409 `REVIEW_OWN_SUBMISSION` for someone deciding their own submission (an admin may).
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }

  /api/v1/staff/clients/{profileId}/verification/reject:
    post:
      tags: [Verification]
      summary: Reject the waiting request, with a reason
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }

  /api/v1/staff/clients/{profileId}/verification/revoke:
    post:
      tags: [Verification]
      summary: Take the Verified mark away (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '409': { description: The profile is not verified (`NOT_VERIFIED`). }

  /api/v1/me/meetings:
    get:
      tags: [Meetings]
      summary: My meetings (members)
      description: When and where, with the other person, for my accepted proposals. Never feedback or notes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The meetings, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MemberMeeting' }

  /api/v1/staff/agenda:
    get:
      tags: [Meetings]
      summary: What waits for me (staff)
      description: Scheduled meetings of my clients and my open follow-ups. `attention` is the badge number.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The agenda.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agenda' }

  /api/v1/staff/connections/{connectionId}/meetings:
    post:
      tags: [Meetings]
      summary: Set a meeting for an accepted proposal
      description: |
        Staff who look after either side (an admin: any). Both people are told. 409
        `CONNECTION_NOT_ACCEPTED`; 400 with `fields[].code = past` for a time in the past.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingInput' }
      responses:
        '201':
          description: The meeting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingRow' }
        '404': { description: No such proposal for you (`CONNECTION_NOT_FOUND`). }

  /api/v1/staff/meetings/{meetingId}/confirm:
    post:
      tags: [Meetings]
      summary: Confirm a meeting the other side proposed
      description: |
        When the two clients have different agents, a meeting set by one side is `proposed` and the other
        side answers: an agent who looks after that side, or an admin. Confirming makes it `scheduled` and
        tells everyone. 409 `MEETING_NOT_PROPOSED`; 403 `MEETING_OWN_PROPOSAL` for the side that proposed it.
        To suggest another time instead, change the time with PATCH: the suggestion becomes your proposal.
      security:
        - bearerAuth: []
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The meeting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingRow' }

  /api/v1/me/meetings/{meetingId}/confirm:
    post:
      tags: [Meetings]
      summary: Confirm a meeting the other side proposed (members)
      security:
        - bearerAuth: []
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Confirmed. }
        '403': { description: MEETING_OWN_PROPOSAL. }
        '409': { description: MEETING_NOT_PROPOSED. }

  /api/v1/me/meetings/{meetingId}/suggest:
    post:
      tags: [Meetings]
      summary: Suggest another time for a proposed meeting (members)
      description: The new time becomes the client's proposal and the other side answers.
      security:
        - bearerAuth: []
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scheduledAt]
              properties:
                scheduledAt: { type: string, format: date-time }
      responses:
        '204': { description: Suggested. }
        '409': { description: MEETING_NOT_PROPOSED. }

  /api/v1/staff/meetings/{meetingId}:
    patch:
      tags: [Meetings]
      summary: Change, cancel or finish a meeting
      description: Only a scheduled meeting can change. `status` may become `done` or `cancelled`. 409 `MEETING_CLOSED`.
      security:
        - bearerAuth: []
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                scheduledAt: { type: string, format: date-time }
                kind: { $ref: '#/components/schemas/MeetingKind' }
                place: { type: [string, 'null'], maxLength: 200 }
                note: { type: [string, 'null'], maxLength: 500 }
                status: { type: string, enum: [done, cancelled] }
      responses:
        '200':
          description: The meeting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingRow' }

  /api/v1/staff/meetings/{meetingId}/feedback/{profileId}:
    put:
      tags: [Meetings]
      summary: Record what one side said after a meeting
      description: For staff who look after that side, once the meeting is done (409 `MEETING_NOT_DONE`). Recording again replaces it. Private to the office.
      security:
        - bearerAuth: []
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verdict]
              properties:
                verdict: { type: string, enum: [interested, undecided, not_interested] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: The meeting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingRow' }

  /api/v1/staff/clients/{profileId}/meetings:
    get:
      tags: [Meetings]
      summary: Meetings of a client's proposals (staff)
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The meetings, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MeetingRow' }

  /api/v1/staff/clients/{profileId}/notes:
    get:
      tags: [Meetings]
      summary: Private notes about a client (staff)
      description: Never shown to the client. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The notes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteList' }
    post:
      tags: [Meetings]
      summary: Add a private note
      description: A note is never changed or deleted.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: All the notes, with the new one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteList' }

  /api/v1/staff/clients/{profileId}/follow-ups:
    get:
      tags: [Meetings]
      summary: A client's follow-ups (staff)
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Open ones first, by due day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpList' }
    post:
      tags: [Meetings]
      summary: Add a follow-up
      description: A reminder for the agent who looks after the client (the creator when nobody does).
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dueOn, text]
              properties:
                dueOn: { type: string, format: date }
                text: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: The follow-ups of the client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpList' }

  /api/v1/staff/follow-ups/{followUpId}/done:
    post:
      tags: [Meetings]
      summary: Mark a follow-up done
      description: 409 `FOLLOW_UP_DONE` when it already is.
      security:
        - bearerAuth: []
      parameters:
        - { name: followUpId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The follow-ups of the client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpList' }

  /api/v1/staff/clients/{profileId}/guardian:
    get:
      tags: [Guardians]
      summary: A client's guardian (staff)
      description: Admin, or the agent who looks after the client. Anyone else gets 404 `PROFILE_NOT_FOUND`.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Where the guardian stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianState' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
    post:
      tags: [Guardians]
      summary: Ask for a guardian for a client
      description: |
        One guardian per profile (409 `GUARDIAN_EXISTS`); an address that already has an account is
        refused (409 `EMAIL_IN_USE`). The client must agree first. For a client who signs in the state is
        `awaiting_client` and nothing is sent until they agree in the app. For a client with no login the
        agent confirms with `clientAgreed: true` (400 otherwise), who and when is kept, and the email goes out now.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardianInvite' }
      responses:
        '201':
          description: Where the guardian stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianState' }
        '409': { description: GUARDIAN_EXISTS or EMAIL_IN_USE. }
    delete:
      tags: [Guardians]
      summary: Cancel the request or end the guardian
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Where the guardian stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianState' }
        '404': { description: No guardian (`GUARDIAN_NOT_FOUND`). }

  /api/v1/staff/clients/{profileId}/guardian/resend:
    post:
      tags: [Guardians]
      summary: Send the invitation again with a new link
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Where the guardian stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianState' }
        '404': { description: No invitation is out (`GUARDIAN_NOT_FOUND`). }

  /api/v1/me/guardian:
    get:
      tags: [Guardians]
      summary: My guardian (members)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Where the guardian stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianState' }
    delete:
      tags: [Guardians]
      summary: Decline the request, or remove my guardian
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Where the guardian stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianState' }
        '404': { description: No guardian (`GUARDIAN_NOT_FOUND`). }

  /api/v1/me/guardian/approve:
    post:
      tags: [Guardians]
      summary: Agree to the guardian my agency asked for
      description: The invitation is emailed now. The agreement is recorded as given in the app.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Where the guardian stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianState' }
        '404': { description: Nothing waits for my agreement (`GUARDIAN_NOT_FOUND`). }

  /api/v1/auth/guardian-invitation/preview:
    post:
      tags: [Guardians]
      summary: What a guardian invitation link is for
      description: Public, 10 per minute, same-origin only. Does not use the link up. 400 `LINK_INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianPreview' }
        '400': { $ref: '#/components/responses/Error400' }

  /api/v1/auth/guardian-invitation/accept:
    post:
      tags: [Guardians]
      summary: Open a guardian invitation, choose a password and sign in
      description: |
        Public, 10 per minute, same-origin only. The link works once, for 7 days, and only at the agency
        that sent it. The account is created now with the role `guardian` and linked to the client's
        profile. The terms and privacy policy must be accepted. 409 `ADDRESS_IN_USE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password, acceptTerms, acceptPrivacy]
              properties:
                token: { type: string }
                password: { type: string }
                acceptTerms: { type: boolean, enum: [true] }
                acceptPrivacy: { type: boolean, enum: [true] }
      responses:
        '200':
          description: The account exists and the person is signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '409': { description: ADDRESS_IN_USE. }

  /api/v1/guardian/ward:
    get:
      tags: [Guardians]
      summary: The client a guardian looks after
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WardSummary' }

  /api/v1/guardian/connections/{connectionId}/advice:
    put:
      tags: [Guardians]
      summary: Advise on a proposal the client received
      description: |
        Only a guardian, and only for a proposal the client received and has not answered (409
        `PROPOSAL_NOT_OPEN`). Advising again replaces it. The client and their agent are told. The
        guardian cannot accept or decline.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [advice]
              properties:
                advice: { type: string, enum: [supportive, concerned] }
                note: { type: string, maxLength: 300 }
      responses:
        '204': { description: Saved. }
        '404': { description: Not a proposal the client received (`CONNECTION_NOT_FOUND`). }
        '409': { description: PROPOSAL_NOT_OPEN. }

  /api/v1/me/payments:
    get:
      tags: [Payments]
      summary: My payments (members)
      description: |
        The signed-in member's own ledger: what was agreed for each stage, what was paid, what is left,
        and every payment with its invoice. A cancelled payment is listed, flagged, without the reason.
        A member with no profile yet gets 404 `PROFILE_NOT_FOUND`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLedger' }
        '404': { $ref: '#/components/responses/TenantNotFound' }

  /api/v1/me/payments/{paymentId}/invoice:
    get:
      tags: [Payments]
      summary: Open the invoice file of one of my payments
      security:
        - bearerAuth: []
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The file, as a PDF, JPEG or PNG.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { description: No such payment or invoice (`INVOICE_NOT_FOUND`). }

  /api/v1/staff/clients/{profileId}/payments:
    get:
      tags: [Payments]
      summary: A client's payments (staff)
      description: Admin, or the agent who looks after the client. Anyone else gets 404 `PROFILE_NOT_FOUND`.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The ledger, with the reason for each cancelled payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLedger' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
    post:
      tags: [Payments]
      summary: Record a payment received in the office
      description: |
        Admin or the client's agent. The amount is in whole taka. The date may not be in the future.
        For a success fee, `connectionId` may name the accepted proposal it came from (422
        `CONNECTION_NOT_ACCEPTED` otherwise). Attach the invoice with the next call.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, amount, paidOn, method]
              additionalProperties: false
              properties:
                stage: { type: string, enum: [registration, success] }
                amount: { type: integer, minimum: 1, maximum: 100000000 }
                paidOn: { type: string, format: date }
                method: { type: string, enum: [cash, bank, bkash, other] }
                reference: { type: string, maxLength: 60 }
                note: { type: string, maxLength: 300 }
                connectionId: { type: string, format: uuid }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRow' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '422': { description: The proposal is not an accepted one of this client (`CONNECTION_NOT_ACCEPTED`). }

  /api/v1/staff/clients/{profileId}/agreements/{stage}:
    put:
      tags: [Payments]
      summary: Set the amount agreed with a client for a stage
      description: Admin or the client's agent. A record of what was agreed, not a charge. Zero is allowed.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stage, in: path, required: true, schema: { type: string, enum: [registration, success] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              additionalProperties: false
              properties:
                amount: { type: integer, minimum: 0, maximum: 100000000 }
      responses:
        '200':
          description: The updated ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLedger' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }

  /api/v1/staff/clients/{profileId}/payments/{paymentId}/invoice:
    put:
      tags: [Payments]
      summary: Attach the invoice file to a payment
      description: |
        The request body is the file itself, sent with its own content type (application/pdf, image/jpeg
        or image/png), up to 5 MB, and its first bytes must match that type (422 `INVOICE_INVALID`).
        `X-File-Name` may carry the name. Once only: 409 `INVOICE_ALREADY_ATTACHED`. Not for a cancelled
        payment (409 `PAYMENT_VOIDED`).
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: The payment with its invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRow' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '413': { description: The file is over 5 MB. }
        '422': { description: The file is not what it says it is. }
    get:
      tags: [Payments]
      summary: Open the invoice file of a payment (staff)
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The file.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { description: No such payment or invoice. }

  /api/v1/staff/clients/{profileId}/payments/{paymentId}/void:
    post:
      tags: [Payments]
      summary: Cancel a payment (admin only)
      description: |
        The record stays, flagged, with the reason. It no longer counts toward what was paid. 409
        `PAYMENT_ALREADY_VOIDED` the second time.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: The updated ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLedger' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: Already cancelled. }

  /api/v1/admin/reports/summary:
    get:
      tags: [Reports]
      summary: The admin's overview (admin only)
      description: |
        People, reviews waiting, proposals by stage and the funnel, twelve months of registrations and
        proposals, each agent's figures, and the money recorded in the office. Money is for one year:
        the financial year (July to June, named by the year it starts in) or the calendar year. Months
        are Bangladesh time. Cancelled payments never count. Limited to 30 a minute.
      security:
        - bearerAuth: []
      parameters:
        - { name: basis, in: query, schema: { type: string, enum: [fiscal, calendar], default: fiscal } }
        - { name: year, in: query, description: 'The year the figures for money are for. Defaults to the current one.', schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryReport' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/admin/reports/proposals:
    get:
      tags: [Reports]
      summary: Every proposal in the agency (admin only)
      description: Newest first, one page at a time. Search matches the member code or name of either side.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [in_review, pending, accepted, declined, withdrawn] } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 60 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalReportPage' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/admin/reports/client-money:
    get:
      tags: [Reports]
      summary: What each client agreed and paid, searched (admin)
      description: Every client with an agreement or a payment, all time, most paid first (at most 100). `q` matches a member's name or code, or their agent's name. Cancelled payments are left out.
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 60 } }
      responses:
        '200':
          description: The clients.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ClientMoney' }

  /api/v1/admin/reports/cancelled-payments:
    get:
      tags: [Reports]
      summary: Payments that were cancelled, with the reason (admin)
      description: Newest cancellation first. They never count in any total. `q` matches the client, their agent, the person who cancelled, or the reason. `totals` is over everything cancelled, whatever the search.
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 60 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
        - { name: after, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelledPage' }

  /api/v1/admin/reports/successful-connections:
    get:
      tags: [Reports]
      summary: Accepted proposals with everything known about each (admin)
      description: Newest first. Each row has both clients and their agents, the dates, meetings, contact sharing and what both clients agreed and paid. `matched` narrows to connections where a client is marked matched (`true`) or not (`false`). `totals` is over all accepted connections, whatever the search.
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 60 } }
        - { name: matched, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
        - { name: after, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessfulPage' }

  /api/v1/staff/connections/{connectionId}/match:
    post:
      tags: [Matches]
      summary: Mark an accepted connection as matched
      description: |
        The end of a successful search, in one step: records who and when, moves both clients to `matched`
        (they stop appearing to others) and withdraws their other waiting proposals, sets the success fee
        each client agrees to pay, and may start a success story. An admin may do it for any connection; an
        agent only when they look after both clients (403 `MATCH_NEEDS_ADMIN` when the clients have
        different agents). 409 `CONNECTION_NOT_ACCEPTED`, `ALREADY_MATCHED`, `PROFILE_NOT_ACTIVE`.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkMatchedInput' }
      responses:
        '201':
          description: Matched.
          content:
            application/json:
              schema:
                type: object
                required: [matchedAt]
                properties:
                  matchedAt: { type: string, format: date-time }

  /api/v1/admin/success-stories/{storyId}/status:
    put:
      tags: [Matches]
      summary: Publish a success story or hide it again (admin)
      description: Publishing needs both clients' agreement (409 `CONSENT_MISSING`).
      security:
        - bearerAuth: []
      parameters:
        - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [published, hidden] }
      responses:
        '204': { description: Done. }

  /api/v1/admin/branding:
    put:
      tags: [Site content]
      summary: Set the agency's name and main colour (admin)
      description: An empty name or colour is removed, so the agency's own name and the platform colour apply. 400 with field codes (`invalid`, `tooLong`, `tooLight` when white cannot be read on the colour).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                primaryColor: { type: string, description: '`#RRGGBB`, or empty to remove.' }
                accentColor: { type: string, description: '`#RRGGBB` light enough for dark text to be read on it (400 `tooDark`), or empty to remove.' }
                theme: { type: string, enum: [classic, modern, warm, royal] }
      responses:
        '204': { description: Saved. }

  /api/v1/admin/branding/logo:
    put:
      tags: [Site content]
      summary: Upload the agency's logo (admin)
      description: The picture is the request body (PNG, JPEG or WebP, up to 2 MB, at least 32 pixels). It is written again as a WebP of at most 512 by 512 pixels. Replaces and deletes the previous logo. 413 `PAYLOAD_TOO_LARGE`, 415 `LOGO_TYPE_UNSUPPORTED`, 422 `LOGO_INVALID` or `LOGO_TOO_SMALL`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: The new logo address.
          content:
            application/json:
              schema:
                type: object
                required: [logoUrl]
                properties:
                  logoUrl: { type: string }
    delete:
      tags: [Site content]
      summary: Remove the agency's logo (admin)
      security:
        - bearerAuth: []
      responses:
        '204': { description: Removed. }

  /api/v1/public/branding/{file}:
    get:
      tags: [Public]
      summary: The agency's logo file
      description: Public, for the agency of the request's host. The file name is a random id, so the response is cached for a year.
      parameters:
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The logo as WebP.
          content:
            image/webp: { schema: { type: string, format: binary } }
        '404': { description: No such file. }

  /api/v1/public/legal/{kind}:
    get:
      tags: [Public]
      summary: The agency's terms of service or privacy policy
      description: When `custom` is false the agency has not written its own, and the page shows the platform's draft.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [terms, privacy] } }
      responses:
        '200':
          description: The current document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicLegal' }

  /api/v1/admin/legal:
    get:
      tags: [Site content]
      summary: The current terms and privacy policy as stored (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Both documents. `version` is 0 when the agency never wrote one.
          content:
            application/json:
              schema:
                type: object
                required: [terms, privacy]
                properties:
                  terms: { $ref: '#/components/schemas/LegalDocument' }
                  privacy: { $ref: '#/components/schemas/LegalDocument' }

  /api/v1/admin/legal/{kind}:
    put:
      tags: [Site content]
      summary: Save a new version of the terms or privacy policy (admin)
      description: Every save is a new numbered version that is kept. Registrations record the version current when the person agreed; existing members are not asked again. Both texts empty goes back to the platform's draft.
      security:
        - bearerAuth: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [terms, privacy] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalInput' }
      responses:
        '200':
          description: The version that was saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }

  /api/v1/admin/site-preview:
    post:
      tags: [Site content]
      summary: Keep a draft of the public site to look at before saving (admin)
      description: The draft (branding and/or content, with the same fields and rules as saving) is applied to a copy of the stored content and kept for 30 minutes under a random link. Nothing is saved and no event is recorded. 400 with field codes for an invalid value.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                branding:
                  type: object
                  properties:
                    name: { type: string }
                    primaryColor: { type: string }
                    accentColor: { type: string }
                    theme: { type: string, enum: [classic, modern, warm, royal] }
                content: { $ref: '#/components/schemas/SiteContentInput' }
      responses:
        '201':
          description: The link's id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, description: 32 hexadecimal characters. }

  /api/v1/public/preview/{id}:
    get:
      tags: [Public]
      summary: A draft of the agency's public site
      description: The same shape as `/public/tenant`, built from a draft. The id is random and expires after 30 minutes; it belongs to one agency (404 `PREVIEW_NOT_FOUND` for any other host).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The draft as the site would be served.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '404': { description: The draft expired or never existed. }

  /api/v1/admin/site-content:
    get:
      tags: [Site content]
      summary: The public site's editable words (admin)
      description: Contact, home title and subtitle, about text and up to three branches. The name, colours and logo are operator-set; success stories come from Reports.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The stored content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteContent' }
    put:
      tags: [Site content]
      summary: Replace the public site's editable words (admin)
      description: Sends all four parts. A part or field left empty is removed and the site shows its default words. 400 with field codes when a value is invalid (`mapUrl` must be https).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteContentInput' }
      responses:
        '204': { description: Saved. }

  /api/v1/admin/activity:
    get:
      tags: [Activity]
      summary: What happened in the agency, who did it and when (admin)
      description: |
        Newest first, read from the event log. Without `group` everything except sign-ins is shown.
        `q` matches the name of the person who did it; `from` and `to` are days in Bangladesh time.
      security:
        - bearerAuth: []
      parameters:
        - { name: group, in: query, required: false, schema: { type: string, enum: [signins, people, profiles, proposals, meetings, payments, chats, guardians, site] } }
        - { name: q, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 60 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: after, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }

  /api/v1/admin/reports/network:
    get:
      tags: [Reports]
      summary: Who is connected with whom (admin only)
      description: |
        With `client`, that client's proposals (open and answered, not withdrawn) around them. Without it,
        the agency's accepted proposals, the newest 60 (`truncated` says more exist).
      security:
        - bearerAuth: []
      parameters:
        - { name: client, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The people and the proposals between them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkReport' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }

  /api/v1/me/chats:
    get:
      tags: [Chat]
      summary: My conversations (members)
      description: |
        Every conversation, newest activity first, with the other person (a name only where the reader may see names), the unread count and the latest message. `enabled` is false when the platform owner turned chat off for the agency.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatList' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/me/connections/{connectionId}/chat:
    post:
      tags: [Chat]
      summary: Ask to chat on an accepted proposal
      description: |
        Both sides must agree. If the other person already asked, the chat starts. A declined or ended conversation can be asked for again; a blocked one cannot. The other person needs a login and a published profile. 20 a minute.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSummary' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/me/chats/{chatId}/messages:
    get:
      tags: [Chat]
      summary: Messages of a conversation, newest first
      description: |
        Opening the first page marks the other person's messages as read. 30 to a page.
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessagePage' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }
    post:
      tags: [Chat]
      summary: Send a message
      description: |
        Text up to 1000 characters. Phone numbers, emails and links are hidden before it is stored (`masked` says so). Only while the conversation is active and both profiles are published. 30 a minute.
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], additionalProperties: false, properties: { body: { type: string, minLength: 1, maxLength: 1000 } } }
      responses:
        '201':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/me/chats/{chatId}/respond:
    post:
      tags: [Chat]
      summary: Accept or decline a request to chat
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accept], additionalProperties: false, properties: { accept: { type: boolean } } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSummary' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/me/chats/{chatId}/end:
    post:
      tags: [Chat]
      summary: End a conversation
      description: |
        Either person may end it. It can be asked for again.
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSummary' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/me/chats/{chatId}/block:
    post:
      tags: [Chat]
      summary: End a conversation and block the other person
      description: |
        The other person cannot ask to chat on this proposal again.
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSummary' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/me/chats/{chatId}/report:
    post:
      tags: [Chat]
      summary: Report a conversation
      description: |
        Tells the admins and the agents of both people. Staff may then read the conversation (each reading is logged). 10 a minute.
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 3, maxLength: 500 } } }
      responses:
        '204': { description: Done. }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/me/chats/{chatId}/chaperone:
    post:
      tags: [Chat]
      summary: Invite my own agent into the conversation
      description: |
        Both people then see that the agent is in it. 409 `NO_AGENT` when nobody looks after the person.
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSummary' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }
    delete:
      tags: [Chat]
      summary: Take my agent out of the conversation
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSummary' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/staff/clients/{profileId}/chats:
    get:
      tags: [Chat]
      summary: A client's conversations (staff)
      description: |
        Admin, or the agent who looks after the client. That a conversation exists, how active it is and any open report; never the text. `canRead` says whether this staff member may open it (reported, or invited in).
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StaffChatRow' } }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/staff/chats/{chatId}/messages:
    get:
      tags: [Chat]
      summary: Read a conversation (staff)
      description: |
        Only when it has an open report, or this staff member was invited in; otherwise 403 `CHAT_NOT_SHARED`. The first page is written to the access log.
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMessagePage' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/staff/chats/{chatId}/end:
    post:
      tags: [Chat]
      summary: End a conversation (staff)
      description: |
        Ends it for both people and closes its reports.
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { note: { type: string, maxLength: 500 } } }
      responses:
        '204': { description: Done. }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/staff/chats/{chatId}/resolve:
    post:
      tags: [Chat]
      summary: Close the reports on a conversation without ending it
      security:
        - bearerAuth: []
      parameters:
        - { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { note: { type: string, maxLength: 500 } } }
      responses:
        '204': { description: Done. }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { description: 'Not allowed in the state of the conversation, or for this person: CHAT_NOT_ACTIVE, CHAT_NOT_AVAILABLE, CHAT_DISABLED, CHAT_NOT_ALLOWED, NO_AGENT.' }

  /api/v1/auth/register:
    post:
      tags: [Registration]
      summary: Start registering as a member
      description: |
        Public, 10 per 10 minutes per client address, same-origin only. Nothing is created yet: a
        link is emailed, and the account exists once it is opened (`/auth/verify-email`). An
        address that already has an account is refused plainly, 409 `EMAIL_ALREADY_REGISTERED`,
        and nothing is emailed (a decision of the owner, 14 October 2026; the sign-in and
        forgot-password answers stay the same for every outcome). One address can be sent 3 such
        emails an hour (429 `EMAIL_RATE_LIMITED`, with `details.retryAfter` and a `Retry-After`
        header). Asking again cancels the earlier link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '202':
          description: The link was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { description: The email already has an account (`EMAIL_ALREADY_REGISTERED`). }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/verify-email:
    post:
      tags: [Registration]
      summary: Open the emailed link, which proves the address, creates the account and signs in
      description: |
        Public, 10 per minute, same-origin only. The link works once, for 24 hours, and only at
        the agency that sent it. The account, its password, the consents and an event are written
        together, and a session starts exactly like a login (the cookie is set and the tokens are
        returned). Only the request that creates the account gets a session: an address that
        already has one (another route, another link) is refused like a used link. A used, expired
        or unknown link is 400 `LINK_INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkToken' }
      responses:
        '200':
          description: The account exists and the person is signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/email/confirm:
    post:
      tags: [Auth]
      summary: Open the emailed link that adds an email to an account
      description: |
        Step three. Public, 10 per minute, same-origin only. Needs no session, because the link may
        be opened on another device, and it signs nobody in. The link works once, for 1 hour, and
        only at the agency that sent it. It adds the address, marked as verified, to the account
        that asked, only if that account still has no email and nobody else has taken the address:
        409 `EMAIL_IN_USE` or 409 `EMAIL_ALREADY_SET` otherwise. A used, expired or unknown link
        is 400 `LINK_INVALID_OR_EXPIRED`. Records `auth.email_added`. A password can then be set
        with the usual forgot-password link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkToken' }
      responses:
        '200':
          description: The address was added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: EMAIL_IN_USE or EMAIL_ALREADY_SET.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/staff-invitation/preview:
    post:
      tags: [Staff]
      summary: What an invitation link is for
      description: |
        Public, 10 per minute, same-origin only. Lets the page greet the person before they choose
        a password. It does not use the link up. A used, cancelled, expired or unknown link is 400
        `LINK_INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkToken' }
      responses:
        '200':
          description: The invited person and the role they are invited to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitationPreview' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/staff-invitation/accept:
    post:
      tags: [Staff]
      summary: Accept an invitation, choose a password and sign in
      description: |
        Public, 10 per minute, same-origin only. The link works once, for 7 days, and only at the
        agency that sent it. The account is created now, as verified and active, with the role the
        admin chose (the request cannot name a role or an address), with the password; a session
        starts exactly like a login (the cookie is set and the tokens are returned). Two requests
        with the same link create one account. An address that got an account since the invitation
        was sent is refused like a used link, and no existing account is ever changed. A password
        that is the email is 400 `INVALID_REQUEST` with the field `password` and code `sameAsEmail`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptStaffInvitationInput' }
      responses:
        '200':
          description: The account exists and the person is signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/client-login/preview:
    post:
      tags: [Clients]
      summary: What a client's login link is for
      description: |
        Public, 10 per minute, same-origin only. Greets the client by name and says how the link
        reached them; it does not use the link up. An unknown, used, cancelled or old link is 400
        `LINK_INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkToken' }
      responses:
        '200':
          description: The link is good.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientLoginPreview' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/client-login/accept:
    post:
      tags: [Clients]
      summary: Open a client's login link, choose a password and sign in
      description: |
        Public, 10 per minute, same-origin only. The link works once, for 7 days, and only at the
        agency that sent it. The account is created now as a member, verified and active, with the
        address the link reached, and attached to the client's existing profile, which stays an
        assisted one with the same agent. The terms and the privacy policy must be accepted and are
        recorded. A session starts exactly like a login. An address that another account uses is 409
        `ADDRESS_IN_USE` and the link stays out; a profile that got an owner meanwhile is 409
        `CLIENT_HAS_LOGIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptClientLoginInput' }
      responses:
        '200':
          description: The account exists and the person is signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { description: ADDRESS_IN_USE or CLIENT_HAS_LOGIN. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email or phone number, and a password
      description: |
        Public, 10 per minute per client address, same-origin only. Starts a session: the
        `matrimony-session` cookie (HttpOnly, SameSite=Strict, `__Host-` and Secure in production)
        is set, and the tokens come back in the body for the page to keep in memory. After five
        wrong passwords for one email, sign-in for that email pauses for 15 minutes, even for the
        right password (429 `TOO_MANY_ATTEMPTS`, with `details.retryAfter` and a `Retry-After`
        header). An unknown email, an account with no password and a wrong password are all the
        same 401 `INVALID_CREDENTIALS`. A disabled account is told so (403 `ACCOUNT_NOT_ACTIVE`)
        only after the right password. Send **either** `email` **or** `phone` (a number that a code
        has proved belongs to an account), never both: the same rules, the same answers and the
        same pause apply to a phone number, counted separately from the email. No text message is
        sent, and none is paid for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: |
        Public, 10 per 10 minutes per client address, same-origin only. Always 202, whether or not
        the email has an active account. The link works once, for 1 hour. One address can be sent
        3 reset emails an hour (429 `EMAIL_RATE_LIMITED`). Asking again cancels the earlier link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordInput' }
      responses:
        '202':
          description: A link was sent if the email has an account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Choose a new password with the emailed link
      description: |
        Public, 10 per 10 minutes per client address, same-origin only. Sets the password, ends
        every session of the account, records `auth.password_reset` and emails the owner a notice.
        A password that breaks the rules is a 400 with field problems and does not use up the
        link. A used, expired or unknown link is 400 `LINK_INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordInput' }
      responses:
        '200':
          description: The password was changed. Sign in with it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/methods:
    get:
      tags: [Auth]
      summary: Which ways of signing in are on
      description: |
        Public. The pages use it to show only buttons that work. `google` is false until the
        Google client id and secret are configured.
      responses:
        '200':
          description: The sign-in methods offered by this deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMethods' }
        '404': { $ref: '#/components/responses/TenantNotFound' }

  /api/v1/auth/google/start:
    post:
      tags: [Auth]
      summary: Start signing in or registering with Google
      description: |
        Public, 10 per minute per client address, same-origin only. Registering needs the same
        agreements as an email registration, checked here before the person leaves. Nothing is
        created yet. Sets the 5-minute single-use `matrimony-challenge` cookie (HttpOnly, Lax,
        because Google sends the browser back from another site) and returns Google's address,
        which carries PKCE, state and nonce. 404 `GOOGLE_NOT_CONFIGURED` when Google is off;
        502 `GOOGLE_UNAVAILABLE` when Google cannot be reached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleStartInput' }
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationUrl' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/google/callback:
    get:
      tags: [Auth]
      summary: Where Google sends the browser back
      description: |
        Public, 10 per minute. Needs the attempt cookie, which is single use. Never returns
        tokens. The identity must come with an email Google has confirmed.
        An identity already linked signs in. Otherwise, an email that already has an account is
        never linked on the email alone: the browser goes to `/{locale}/link-google` to give that
        account's password (see `/auth/google/link`). Otherwise a registration creates a member
        (no password). A login that finds no account creates nothing: the browser goes to
        `/{locale}/signup-google` to agree to the terms first (see `/auth/google/signup`).
      responses:
        '302':
          description: |
            Signed in: `Location: /{locale}/dashboard` and the `matrimony-session` cookie is set.
            Needs the account's password: `Location: /{locale}/link-google` and the strict
            `matrimony-link` cookie is set (10 minutes). No account yet:
            `Location: /{locale}/signup-google` and the strict `matrimony-signup` cookie is set
            (10 minutes). Failure:
            `Location: /{locale}/login?error=<code>` with GOOGLE_AUTH_FAILED,
            GOOGLE_EMAIL_UNVERIFIED, ACCOUNT_HAS_NO_PASSWORD, ACCOUNT_NOT_ACTIVE,
            OAUTH_CHALLENGE_EXPIRED, OAUTH_CONTEXT_MISMATCH, GOOGLE_RETRY, INVALID_REQUEST or
            GOOGLE_NOT_CONFIGURED. `{locale}` is the language the person was reading.
          headers:
            Location:
              schema: { type: string }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/google/pending:
    get:
      tags: [Auth]
      summary: Whose account is waiting for its password
      description: |
        Public, 20 per minute. Needs the `matrimony-link` cookie. Returns the email of the account
        the Google sign-in is waiting to be linked to, so the page can ask for its password.
        400 `LINK_INVALID_OR_EXPIRED` when there is none.
      responses:
        '200':
          description: The account waiting to be linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingGoogleLink' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/google/signup:
    get:
      tags: [Auth]
      summary: Who Google says is signing up
      description: |
        Public, 20 per minute. Needs the `matrimony-signup` cookie. Returns the email and name
        Google vouched for, so the page can ask the person to agree to the terms before an account
        is created. 400 `LINK_INVALID_OR_EXPIRED` when there is none.
      responses:
        '200':
          description: The Google person waiting to agree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingGoogleSignup' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Auth]
      summary: Agree to the terms, create the account, and sign in
      description: |
        Public, 10 per minute, same-origin only. Needs the `matrimony-signup` cookie. The account
        is created as a member (no password) from the name and email Google vouched for, never from
        the request, with the consents and the registration event, and a session starts exactly like
        a login. Missing agreements are 400 with the field code `required` and leave the step open;
        any other outcome ends it. 409 `GOOGLE_RETRY` when an account for the address appeared in
        the meantime (Google sign-in will then find it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignupInput' }
      responses:
        '200':
          description: Account created and signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: An account for the address appeared meanwhile (GOOGLE_RETRY).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/google/link:
    post:
      tags: [Auth]
      summary: Link Google to the account with its password, and sign in
      description: |
        Public, 10 per minute, same-origin only. Needs the `matrimony-link` cookie. The password
        is checked like at sign-in, and a wrong one counts toward the same pause (429
        `TOO_MANY_ATTEMPTS`). A wrong password leaves the step open to retry; success links Google,
        records `auth.identity_linked`, ends the step and starts a session exactly like a login.
        409 `GOOGLE_ALREADY_LINKED` when the account already has a Google identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleLinkInput' }
      responses:
        '200':
          description: Linked and signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/phone/start:
    post:
      tags: [Auth]
      summary: Send a code to log in or to register with a phone number
      description: |
        Public, 10 per 10 minutes by address, same-origin only. Sends a six-digit code by text
        message. `purpose` says why. A code to **log in** is sent only to a number that has an
        active account; for any other number (or a disabled account) nothing is sent and nothing is
        paid for, and the answer is 404 `PHONE_NOT_REGISTERED`, so the page can send the person to
        register. The per-number limits below apply first. A code to
        **register** is sent to any allowed number, since a new member has no account yet. The two
        kinds of code are kept apart: one cannot be used for the other. Only numbers of the
        allowed countries (`SMS_ALLOWED_COUNTRIES`, Bangladesh by default, see
        `phoneCountries` in `/auth/methods`) are sent a code: 400 `PHONE_COUNTRY_NOT_SUPPORTED`.
        A code works once, for 5 minutes, and asking again replaces it. A number can be sent one code a minute and 5 an hour,
        and an agency 2000 a day: 429 `CODE_RATE_LIMITED` with `Retry-After`. 502
        `SMS_UNAVAILABLE` when the gateway does not accept the message, 404
        `PHONE_NOT_CONFIGURED` when no sender is set up. Numbers are stored as E.164; Bangladeshi
        mobile numbers may be written `01712345678`, `8801712345678` or `+8801712345678`, and
        Bengali digits are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneStartInput' }
      responses:
        '202':
          description: A code was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSent' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/phone/verify:
    post:
      tags: [Auth]
      summary: Check the code
      description: |
        Public, 10 per minute by address, same-origin only. A right code uses the code up. When the
        number belongs to an account, 200 signs the person in exactly like a login (the cookie is
        set and the tokens are returned); a disabled account is 403 `ACCOUNT_NOT_ACTIVE`. When it
        has no account, nothing is created: 202 with the strict `matrimony-signup` cookie (10
        minutes) and the person finishes on `/{locale}/signup-phone` (see `/auth/phone/signup`). A
        wrong code is 400 `CODE_INVALID` and can be tried again; five wrong ones, a used or an
        expired code are 400 `CODE_EXPIRED` and a new code must be asked for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneVerifyInput' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '202':
          description: The number is proven but has no account yet. The person must agree to the terms.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/phone/signup:
    get:
      tags: [Auth]
      summary: The number waiting to finish registering
      description: |
        Public, 20 per minute. Needs the `matrimony-signup` cookie. Returns the number the code
        proved, so the page can ask for the name and the agreement to the terms. 400
        `LINK_INVALID_OR_EXPIRED` when there is none.
      responses:
        '200':
          description: The proven number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingPhoneSignup' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Auth]
      summary: Give a name, agree to the terms, create the account, and sign in
      description: |
        Public, 10 per minute, same-origin only. Needs the `matrimony-signup` cookie. The account
        is created as a member (no email, no password) with the number the code proved, never one
        from the request, with the consents and the registration event, and a session starts exactly
        like a login. Missing agreements are 400 with the field code `required`. The step is used
        up at once, so a double press cannot create two accounts. 409 `PHONE_RETRY` when an account
        for the number appeared in the meantime (the number will then sign in).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneSignupInput' }
      responses:
        '200':
          description: Account created and signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: An account for the number appeared meanwhile (PHONE_RETRY).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/session:
    post:
      tags: [Session]
      summary: Restore the browser session
      description: |
        For a reload or a new tab: the session cookie alone brings back a working token set. Needs
        the session cookie and a same-origin `Origin` header, but no CSRF header: this call returns
        the CSRF token. A concurrent duplicate returns 409 REFRESH_UNAVAILABLE.
      responses:
        '200':
          description: A fresh token set for this session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: Another refresh is running. Retry after it finishes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the access token
      description: |
        Needs the session cookie, a same-origin `Origin` header and `X-CSRF-Token`. 409
        REFRESH_UNAVAILABLE means another refresh is running; any other failure means log in again.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: A new token set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: Another refresh is running. Retry after it finishes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: End the session
      description: Same protection as refresh. Takes effect immediately.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Logged out. }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/me:
    get:
      tags: [Account]
      summary: The signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current tenant-local account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Self' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/me/sign-in-methods:
    get:
      tags: [Account]
      summary: What the signed-in account can sign in with
      description: |
        For the account settings. The phone number is partly hidden (`+8801••••••678`). An account
        may have no email (it registered with a phone), no password (it registered with Google or a
        phone), or no phone.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The sign-in methods of the account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInMethods' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/me/phone/start:
    post:
      tags: [Account]
      summary: Send a code to a number to add or change to
      description: |
        10 per 10 minutes. Same answer and same limits as `/auth/phone/start`, whether or not
        another account has the number. The code belongs to this account: it cannot be used to sign
        in, and a code sent for another account cannot be used here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneAttachStartInput' }
      responses:
        '202':
          description: A code was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSent' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/phone/verify:
    post:
      tags: [Account]
      summary: Check the code and make the number this account's own
      description: |
        10 per minute. A right code adds the number (replacing an earlier one) and records
        `auth.phone_added`; from then on the number signs in to this account. 409 `PHONE_IN_USE`
        when another account already has the number (the person proved they hold it, so this
        reveals nothing they lack). Wrong and old codes are 400 `CODE_INVALID` and `CODE_EXPIRED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneAttachInput' }
      responses:
        '200':
          description: The number was added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: Another account already has this number (PHONE_IN_USE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/reauth/start:
    post:
      tags: [Account]
      summary: Send a code to the account's own phone, to prove it is the owner
      description: |
        Step one of adding an email to a phone-only account, and of choosing a new password with a
        code (`/me/password`). 10 per 10 minutes. The code goes to the
        number the account already has, never to one from the request, and it belongs to this
        purpose: it cannot sign anyone in, and a sign-in code cannot be used for it. Same limits as
        other codes (one a minute and 5 an hour per number). 409 `PHONE_REQUIRED` when the account has
        no verified phone, 404 `PHONE_NOT_CONFIGURED` when no sender is set up.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthStartInput' }
      responses:
        '202':
          description: A code was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSent' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: EMAIL_ALREADY_SET or PHONE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/password:
    post:
      tags: [Account]
      summary: Choose a new password, with a code sent to the account's own phone
      description: |
        For an account that has a verified phone, including a member who registered with a phone
        and forgot the password and may have no email. 10 per 10 minutes. Needs the code from
        `/me/reauth/start` (400 `CODE_INVALID` to try again, 400 `CODE_EXPIRED` after five wrong
        ones or an old one), so a stolen session alone cannot do it. The new password follows the
        usual rules and may not be the email or the phone number (400 with the field problem
        `sameAsEmail` or `sameAsPhone`; the code is not spent). It ends **every** session of the
        account, this one included, like any password reset: the person logs in again. The owner is
        told by email when the account has one. Records `auth.password_reset`. 409
        `PHONE_REQUIRED` without a verified phone.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '200':
          description: The password was changed and every session ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: PHONE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/email/start:
    post:
      tags: [Account]
      summary: Send a link to an address to add it to the account
      description: |
        Step two. 10 per 10 minutes. With the right code from `/me/reauth/start` (a wrong one is
        400 `CODE_INVALID`, five wrong ones or an old one 400 `CODE_EXPIRED`), a link that works
        once for 1 hour is emailed to the address. Nothing is added until the link is opened. The
        answer is the same whether or not the address already belongs to an account: that account's
        owner gets a notice instead of a link. Asking again cancels the earlier link. An address is
        sent 3 of these emails an hour (429 `EMAIL_RATE_LIMITED`). An existing email is never
        replaced.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddEmailStartInput' }
      responses:
        '202':
          description: The link was sent, or the address is in use and its owner was told.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: EMAIL_ALREADY_SET or PHONE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/profile:
    get:
      tags: [My profile]
      summary: The member's own profile and review state
      description: Members only. `profile` is null until the first save.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile, the waiting review and the last decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    put:
      tags: [My profile]
      summary: Save the draft
      description: Creates the profile on the first save. Only a draft or rejected profile can be saved; a rejected one becomes a draft again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: The saved state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_EDIT_REQUIRES_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/submit:
    post:
      tags: [My profile]
      summary: Send the draft for review
      description: 'Needs every required field: full name, date of birth, gender, marital status, height, religion, current district, highest degree, occupation and phone.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSubmit' }
      responses:
        '200':
          description: The profile is now pending review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PROFILE_INCOMPLETE, with details.fields listing what is missing.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/edit-requests:
    post:
      tags: [My profile]
      summary: Ask for changes to a published profile
      description: The published profile stays as it is until a reviewer approves. Only the fields that differ are recorded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: The state with a waiting field update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'NO_CHANGES or PROFILE_INCOMPLETE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/pending-review:
    delete:
      tags: [My profile]
      summary: Withdraw the waiting review
      description: A first submission goes back to being an editable draft; a change request is dropped.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The state after withdrawing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND or NO_PENDING_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }

  /api/v1/me/profile/photos:
    get:
      tags: [My photos]
      summary: The member's own photos
      description: Members only. Empty until the first upload. The profile need not exist yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The photos, in upload order, and the limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [My photos]
      summary: Upload a photo
      description: |
        The request body is the picture itself, not a form. Send it with its own content type
        (image/jpeg, image/png or image/webp), at most 5 MB. The server checks the real file type,
        removes location and camera details, and stores two WebP sizes. The photo starts as
        waiting for review and is shown to nobody else until approved. Needs a saved profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: The photos, now including the new one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND: save the profile first.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PHOTO_LIMIT_REACHED, or PROFILE_STATE_INVALID for a closed profile.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '413':
          {
            description: 'PAYLOAD_TOO_LARGE: over 5 MB.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '415':
          {
            description: 'UNSUPPORTED_MEDIA_TYPE or PHOTO_TYPE_UNSUPPORTED (for example GIF or SVG).',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PHOTO_INVALID (not a readable picture) or PHOTO_TOO_SMALL (shortest side under 200 px).',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}:
    delete:
      tags: [My photos]
      summary: Remove a photo
      description: Immediate, whatever the photo's state. A review still waiting on it is cancelled, and if it was the main photo the next approved one takes its place.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The photos that remain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}/primary:
    put:
      tags: [My photos]
      summary: Choose the main photo
      description: Only an approved photo can be the main one. The previous main photo stops being it.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The photos, with the new main photo marked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PHOTO_NOT_APPROVED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}/image:
    get:
      tags: [My photos]
      summary: The picture of one of the member's own photos
      description: |
        Returns the image itself (WebP), so the frontend requests it with the access token and
        shows it from the response; an image tag cannot send the token. A member can see their
        own waiting photos. Files are never public.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: size,
            in: query,
            schema: { type: string, enum: [thumb, full], default: full },
            description: 'thumb is 400 px on the longest side, full is up to 1600 px.',
          }
      responses:
        '200':
          description: The picture.
          content:
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/reviews:
    get:
      tags: [Review queue]
      summary: The approval queue
      description: |
        Admins and agents. Waiting requests are listed oldest first, decided ones newest first.
        An admin sees every request. An agent sees those for clients assigned to them and for
        profiles nobody has been assigned to yet.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/QueueStatus' },
            description: Default pending.,
          }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/QueueKind' } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: after,
            in: query,
            schema: { type: string },
            description: The `next` of the previous page.,
          }
      responses:
        '200':
          description: One page of the queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuePage' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/reviews/summary:
    get:
      tags: [Review queue]
      summary: How many requests are waiting for this reviewer
      description: For the badge in the navigation. Counted the same way the queue is listed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The number waiting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueSummary' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/reviews/{reviewId}:
    get:
      tags: [Review queue]
      summary: One request, with what it would change
      description: |
        A first submission lists everything filled in. A change request lists each changed field
        with its published and proposed value. `canDecide` and `blockedBy` say whether this
        reviewer may decide it now. A request an agent may not see is reported as not found.
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'REVIEW_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/reviews/{reviewId}/photo:
    get:
      tags: [Review queue]
      summary: The photo a request is about
      description: The image itself (WebP), requested with the access token. Only for a photo request the reviewer may see.
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: size, in: query, schema: { type: string, enum: [thumb, full], default: full } }
      responses:
        '200':
          description: The picture.
          content:
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'REVIEW_NOT_FOUND or PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/reviews/{reviewId}/approve:
    post:
      tags: [Review queue]
      summary: Approve a request
      description: |
        A first submission publishes the profile. A change request is applied to it. A photo
        becomes visible, and the main photo if there is none yet. Refused if the profile changed
        since the request was made, or since the version the reviewer saw. Nobody approves their
        own submission, except an admin.
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveInput' }
      responses:
        '200':
          description: The request, now approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'REVIEW_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'REVIEW_ALREADY_DECIDED, REVIEW_CANCELLED, REVIEW_OUT_OF_DATE or REVIEW_OWN_SUBMISSION.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PROFILE_INCOMPLETE: applying it would leave a required field empty.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/reviews/{reviewId}/reject:
    post:
      tags: [Review queue]
      summary: Reject a request
      description: |
        Needs a reason, which the member sees. A rejected first submission goes back to the member
        as "needs changes". A rejected change request leaves the published profile as it was. A
        rejected photo stays with its owner, unpublished.
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectInput' }
      responses:
        '200':
          description: The request, now rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'REVIEW_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'REVIEW_ALREADY_DECIDED, REVIEW_CANCELLED, REVIEW_OUT_OF_DATE or REVIEW_OWN_SUBMISSION.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients:
    get:
      tags: [Clients]
      summary: The clients, most recently changed first
      description: |
        An admin sees every profile of the agency; an agent only those assigned to them, whatever
        they ask for. `assignedTo` is an admin's filter.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProfileStatus' } }
        - { name: serviceMode, in: query, schema: { $ref: '#/components/schemas/ServiceMode' } }
        - {
            name: assignedTo,
            in: query,
            schema: { type: string },
            description: "Admin only: an agent's id, or none for clients nobody looks after.",
          }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: Part of a name or member code.,
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: after, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of clients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPage' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Clients]
      summary: Create an assisted client
      description: |
        A draft profile for someone who has no login. It belongs to the agency, is created by this
        staff member and is assigned to an agent: an agent's client is always theirs, an admin may
        name an agent or leave it unassigned. It goes through review like any profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: The new client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '422':
          {
            description: 'AGENT_NOT_AVAILABLE: the agent is not an active admin or agent of this agency.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}:
    get:
      tags: [Clients]
      summary: A client's profile and who looks after it
      description: A profile the staff member may not manage is reported as not found.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The profile, its waiting review, and the client details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
    put:
      tags: [Clients]
      summary: Save an assisted client's draft
      description: Same rules as a member's own draft. Not for a member who runs their own profile.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: The saved state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403':
          {
            description: "PROFILE_SELF_SERVICE: staff do not edit a member's own profile.",
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_EDIT_REQUIRES_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/submit:
    post:
      tags: [Clients]
      summary: Send an assisted client's draft for review
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSubmit' }
      responses:
        '200':
          description: The profile is now pending review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403':
          {
            description: 'PROFILE_SELF_SERVICE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PROFILE_INCOMPLETE, with details.fields listing what is missing.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/edit-requests:
    post:
      tags: [Clients]
      summary: Ask for changes to a published assisted client
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: The state with a waiting field update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403':
          {
            description: 'PROFILE_SELF_SERVICE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'NO_CHANGES or PROFILE_INCOMPLETE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/pending-review:
    delete:
      tags: [Clients]
      summary: Withdraw the waiting review of an assisted client
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The state after withdrawing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403':
          {
            description: 'PROFILE_SELF_SERVICE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '404':
          {
            description: 'PROFILE_NOT_FOUND or NO_PENDING_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/status:
    post:
      tags: [Clients]
      summary: Pause, reactivate, match or close a profile
      description: |
        Moves a profile between its live states: active to paused, matched or closed; paused or
        matched back to active or to closed. A profile waiting for review cannot be moved. Closed is
        final. Works for a member's own profile too, since it changes whether the profile is shown,
        not what it says.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChange' }
      responses:
        '200':
          description: The profile in its new state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT or STATUS_CHANGE_NOT_ALLOWED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/assignment:
    put:
      tags: [Clients]
      summary: Hand a profile to an agent
      description: Admins only. Changing who looks after a profile does not make a waiting request out of date.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInput' }
      responses:
        '200':
          description: The profile with its new agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'AGENT_NOT_AVAILABLE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/matches:
    get:
      tags: [Matches]
      summary: My matches
      description: |
        A member's own matches: the profiles staff released to them, newest release first, with only
        the fields staff chose for them (see ReleaseSettings). Nothing outside the released set is
        reachable. The filters search inside that set; a filter on a field the member may not see is
        refused with FILTER_NOT_AVAILABLE, so a hidden value cannot be found out. A member whose own
        profile is not published yet gets an empty list and their profileStatus.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: q,
            in: query,
            description: A member code,
            schema: { type: string, maxLength: 20 },
          }
        - { name: ageMin, in: query, schema: { type: integer, minimum: 18, maximum: 100 } }
        - { name: ageMax, in: query, schema: { type: integer, minimum: 18, maximum: 100 } }
        - { name: religion, in: query, schema: { $ref: '#/components/schemas/Religion' } }
        - { name: maritalStatus, in: query, schema: { $ref: '#/components/schemas/MaritalStatus' } }
        - { name: profession, in: query, schema: { $ref: '#/components/schemas/Profession' } }
        - { name: district, in: query, schema: { $ref: '#/components/schemas/District' } }
        - {
            name: educationMin,
            in: query,
            description: The lowest education level wanted,
            schema: { $ref: '#/components/schemas/EducationLevel' },
          }
        - {
            name: heightMin,
            in: query,
            description: Advanced search,
            schema: { type: integer, minimum: 100, maximum: 250 },
          }
        - {
            name: heightMax,
            in: query,
            description: Advanced search,
            schema: { type: integer, minimum: 100, maximum: 250 },
          }
        - {
            name: incomeMin,
            in: query,
            description: Advanced search,
            schema: { $ref: '#/components/schemas/IncomeBand' },
          }
        - {
            name: incomeMax,
            in: query,
            description: Advanced search,
            schema: { $ref: '#/components/schemas/IncomeBand' },
          }
        - {
            name: familyStatusMin,
            in: query,
            description: Advanced search,
            schema: { $ref: '#/components/schemas/FamilyStatus' },
          }
        - {
            name: originDistrict,
            in: query,
            description: Advanced search,
            schema: { $ref: '#/components/schemas/District' },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: after,
            in: query,
            description: The next value of the previous page,
            schema: { type: string },
          }
      responses:
        '200':
          description: One page of matches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchPage' }
        '400':
          {
            description: 'Invalid input, or FILTER_NOT_AVAILABLE (details.fields names the filters the member may not use).',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/me/matches/{candidateId}:
    get:
      tags: [Matches]
      summary: The full view of a profile
      description: |
        Every field staff allowed this member to see, for someone in their released window, someone they
        are connected to, or someone who asked to connect with them and is waiting for an answer. The
        contact is present only when the other person shared it after the connection was accepted, and
        never includes an address.
      security:
        - bearerAuth: []
      parameters:
        - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND: not theirs to look at, or no longer published.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/matches/{candidateId}/photo:
    get:
      tags: [Matches]
      summary: The photo of a match
      description: |
        The main published photo of a profile in the member's window, as WebP. Only when staff allow
        photos for this member. Private to the browser, so it is requested with the access token.
      security:
        - bearerAuth: []
      parameters:
        - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: size, in: query, schema: { type: string, enum: [thumb, full], default: thumb } }
      responses:
        '200':
          description: The picture.
          content:
            image/webp:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND: no photo, not in the window, or photos are not shown to this member.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/connections:
    post:
      tags: [Connections]
      summary: Ask to connect
      description: |
        A member with a published profile asks someone in their released window. There is one connection
        per pair: asking again while waiting changes nothing, and two people asking each other end as one
        accepted connection (outcome accepted, both are told). A declined pair stays declined. A
        withdrawn request can be asked again. A request to a member with a login first waits for review
        (status in_review): the agent who looks after the person asked, or an admin when nobody does,
        approves it, and only then is the person asked told. A client with no login is answered for by
        the agent who looks after them, so for them the request goes straight to the agent. A short
        note (at most 300 characters and 40 words) may travel with the request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequestInput' }
      responses:
        '200':
          description: What happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionResult' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND: not in the window, unknown, or oneself.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_NOT_PUBLISHED, or CONNECTION_DECLINED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
    get:
      tags: [Connections]
      summary: My connections
      description: |
        received: waiting for my answer. sent: waiting for theirs. connected: accepted. The other person
        is shown with only the fields staff allowed this member.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: box,
            in: query,
            schema: { type: string, enum: [received, sent, connected], default: received },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: after, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionPage' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/me/connections/{connectionId}/respond:
    post:
      tags: [Connections]
      summary: Answer a request made to me
      description: Only the person asked answers, once.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionResponseInput' }
      responses:
        '204': { description: Answered. }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'CONNECTION_NOT_FOUND',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CONNECTION_NOT_PENDING',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/connections/{connectionId}/withdraw:
    post:
      tags: [Connections]
      summary: Take back a request I made
      description: Only the person who asked, and only while it has not been answered.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Withdrawn. }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'CONNECTION_NOT_FOUND',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CONNECTION_NOT_PENDING',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/connections/{connectionId}/share-contact:
    post:
      tags: [Connections]
      summary: Share my contact details
      description: |
        After a connection is accepted, a member may share their own contact details with the other
        person. Only the member can say so for themselves. The address is never shared.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Shared. }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'CONNECTION_NOT_FOUND',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CONNECTION_NOT_ACCEPTED',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/notifications:
    get:
      tags: [Connections]
      summary: My inbox
      description: |
        Newest first. For a member, what happened to them. For staff, what happened to the clients they
        look after. A name is present only if the member may see names. Each line says whether it was read.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: after, in: query, schema: { type: string } }
        - {
            name: group,
            in: query,
            description: 'Narrow to a group of lines: requests (new, forwarded, in review, withdrawn), answers (accepted, declined), contact (shared details), reviews (profile, photo and CV reviews), updates (released matches, assignments, staff joined), chats (requests to chat, new messages, reports).',
            schema: { type: string, enum: [requests, answers, contact, reviews, updates, chats] },
          }
        - { name: read, in: query, schema: { type: string, enum: [read, unread] } }
        - { name: from, in: query, description: 'First day, YYYY-MM-DD, Bangladesh time.', schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: to, in: query, description: 'Last day, YYYY-MM-DD, Bangladesh time, included.', schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - {
            name: q,
            in: query,
            description: 'Search by member code, or by name when the reader may see names. Matches the person the line is about and, for staff, the client it is for.',
            schema: { type: string, minLength: 1, maxLength: 60 },
          }
        - { name: client, in: query, description: 'Staff only: one client''s profile id. Ignored for members.', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/me/notifications/stream:
    get:
      tags: [Connections]
      summary: Live notifications (server-sent events)
      description: |
        A stream for the signed-in account. It sends `event: unread` with `{ "unread": n }` at once and
        again each time a line is added to the inbox (or the connection to the database came back after
        a gap); the page then reads the list in the usual way. Only the count travels. A comment goes out
        every 20 seconds, `event: end` is sent after ten minutes (the page reconnects with a fresh
        token), and an account may keep five streams open (429 TOO_MANY_STREAMS). The request needs
        the bearer token, so use `fetch` and read the body rather than `EventSource`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error401' }
        '429':
          {
            description: 'TOO_MANY_STREAMS.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/notifications/unread-count:
    get:
      tags: [Connections]
      summary: Unread inbox count
      description: How many lines of my inbox I have not read. Cheap enough to ask every few seconds.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unread]
                properties:
                  unread: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/me/notifications/read:
    post:
      tags: [Connections]
      summary: Mark inbox lines as read
      description: |
        With `ids`, marks those lines; without, every unread line. Lines that are not mine or are
        already read are left alone, so repeating the call is harmless.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Marked. }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/me/profile/cv:
    get:
      tags: [CV]
      summary: My CV
      description: |
        The CV others may see (`current`) and a replacement waiting for review or turned down
        (`replacement`). One PDF per profile.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
    put:
      tags: [CV]
      summary: Upload or replace my CV
      description: |
        The request body is the PDF itself (`Content-Type: application/pdf`, at most 5 MB). The name
        comes from `X-File-Name`, percent-encoded. It waits for review; the old CV stays published until
        the new one is approved. Only PDF: other types, files that are not a PDF and PDFs with scripts,
        launch actions, embedded files or submit forms are refused.
      security:
        - bearerAuth: []
      parameters:
        - { name: X-File-Name, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: The new state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_STATE_INVALID: a closed profile.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '413':
          {
            description: 'CV_TOO_LARGE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '415':
          {
            description: 'UNSUPPORTED_MEDIA_TYPE or CV_NOT_A_PDF.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'CV_ACTIVE_CONTENT.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
    delete:
      tags: [CV]
      summary: Remove my CV
      description: Removes the CV others see and any replacement, and deletes their files.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The new state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/cv/file:
    get:
      tags: [CV]
