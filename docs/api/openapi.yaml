    ProfileStatus:
      type: string
      enum: [draft, pending_review, rejected, active, paused, matched, closed]
    ProfileContent:
      type: object
      additionalProperties: false
      description: |
        Biodata. Every field may be omitted or null in a request (a draft can be partial); a
        response always contains every field. An empty string counts as null.
      properties:
        managedFor: { $ref: '#/components/schemas/ManagedFor' }
        fullName: { type: string, minLength: 1, maxLength: 100 }
        dateOfBirth:
          {
            type: [string, 'null'],
            format: date,
            description: 'YYYY-MM-DD. The member must be 18 to 100 years old.',
          }
        gender: { anyOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        maritalStatus: { anyOf: [{ $ref: '#/components/schemas/MaritalStatus' }, { type: 'null' }] }
        heightCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        weightKg: { type: [integer, 'null'], minimum: 20, maximum: 300 }
        complexionCode: { anyOf: [{ $ref: '#/components/schemas/Complexion' }, { type: 'null' }] }
        bloodGroup: { anyOf: [{ $ref: '#/components/schemas/BloodGroup' }, { type: 'null' }] }
        nationalityCode:
          { type: string, pattern: '^[A-Z]{2}$', description: ISO country code. BD when omitted. }
        religionCode: { anyOf: [{ $ref: '#/components/schemas/Religion' }, { type: 'null' }] }
        sectCode: { anyOf: [{ $ref: '#/components/schemas/Sect' }, { type: 'null' }] }
        currentCity: { type: [string, 'null'], maxLength: 100 }
        currentDistrictCode:
          { anyOf: [{ $ref: '#/components/schemas/District' }, { type: 'null' }] }
        originDistrictCode: { anyOf: [{ $ref: '#/components/schemas/District' }, { type: 'null' }] }
        highestDegreeCode: { anyOf: [{ $ref: '#/components/schemas/Degree' }, { type: 'null' }] }
        institutionName: { type: [string, 'null'], maxLength: 150 }
        fieldOfStudy: { type: [string, 'null'], maxLength: 100 }
        graduationYear: { type: [integer, 'null'], minimum: 1950, maximum: 2100 }
        occupationCode: { anyOf: [{ $ref: '#/components/schemas/Occupation' }, { type: 'null' }] }
        jobTitle: { type: [string, 'null'], maxLength: 100 }
        employerName: { type: [string, 'null'], maxLength: 150 }
        monthlyIncomeBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        fatherName: { type: [string, 'null'], maxLength: 100 }
        fatherOccupation: { type: [string, 'null'], maxLength: 100 }
        motherName: { type: [string, 'null'], maxLength: 100 }
        motherOccupation: { type: [string, 'null'], maxLength: 100 }
        siblingCount: { type: [integer, 'null'], minimum: 0, maximum: 30 }
        familyStatusCode:
          { anyOf: [{ $ref: '#/components/schemas/FamilyStatus' }, { type: 'null' }] }
        religiousPracticeCode:
          { anyOf: [{ $ref: '#/components/schemas/ReligiousPractice' }, { type: 'null' }] }
        dietaryPreferenceCode:
          { anyOf: [{ $ref: '#/components/schemas/DietaryPreference' }, { type: 'null' }] }
        professionCode: { anyOf: [{ $ref: '#/components/schemas/Profession' }, { type: 'null' }] }
        smokingCode: { anyOf: [{ $ref: '#/components/schemas/SmokingHabit' }, { type: 'null' }] }
        childrenCode: { anyOf: [{ $ref: '#/components/schemas/ChildrenStatus' }, { type: 'null' }] }
        relocationCode:
          { anyOf: [{ $ref: '#/components/schemas/RelocationOption' }, { type: 'null' }] }
        hobbies: { type: [string, 'null'], maxLength: 500 }
        aboutMe: { type: [string, 'null'], maxLength: 2000 }

    ContactDetails:
      type: object
      additionalProperties: false
      description: Private contact details. Never shown to other members.
      properties:
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactRelationship: { type: [string, 'null'], maxLength: 50 }
        phone:
          {
            type: [string, 'null'],
            pattern: "^\\+[1-9][0-9]{7,14}$",
            description: 'E.164, for example +8801712345678.',
          }
        email: { type: [string, 'null'], format: email, maxLength: 200 }
        permanentAddress: { type: [string, 'null'], maxLength: 300 }

    PartnerPreferences:
      type: object
      additionalProperties: false
      description: Lists are empty when the member has no preference. Ranges may not be reversed.
      properties:
        ageMin: { type: [integer, 'null'], minimum: 18, maximum: 100 }
        ageMax: { type: [integer, 'null'], minimum: 18, maximum: 100 }
        heightMinCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        heightMaxCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        religionCodes: { type: array, items: { $ref: '#/components/schemas/Religion' } }
        sectCodes: { type: array, items: { $ref: '#/components/schemas/Sect' } }
        maritalStatusCodes: { type: array, items: { $ref: '#/components/schemas/MaritalStatus' } }
        educationMinCode:
          { anyOf: [{ $ref: '#/components/schemas/EducationLevel' }, { type: 'null' }] }
        occupationCodes: { type: array, items: { $ref: '#/components/schemas/Occupation' } }
        districtCodes: { type: array, items: { $ref: '#/components/schemas/District' } }
        incomeMinBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        incomeMaxBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        familyStatusMinCode:
          { anyOf: [{ $ref: '#/components/schemas/FamilyStatus' }, { type: 'null' }] }
        professionCodes: { type: array, items: { $ref: '#/components/schemas/Profession' } }
        complexionCodes: { type: array, items: { $ref: '#/components/schemas/Complexion' } }
        religiousPracticeCodes:
          { type: array, items: { $ref: '#/components/schemas/ReligiousPractice' } }
        dietaryPreferenceCodes:
          { type: array, items: { $ref: '#/components/schemas/DietaryPreference' } }
        smokingCodes: { type: array, items: { $ref: '#/components/schemas/SmokingHabit' } }
        childrenCodes: { type: array, items: { $ref: '#/components/schemas/ChildrenStatus' } }
        relocationCodes: { type: array, items: { $ref: '#/components/schemas/RelocationOption' } }

    ProfileData:
      type: object
      additionalProperties: false
      properties:
        profile: { $ref: '#/components/schemas/ProfileContent' }
        contact: { $ref: '#/components/schemas/ContactDetails' }
        preferences: { $ref: '#/components/schemas/PartnerPreferences' }
    ProfileInput:
      type: object
      additionalProperties: false
      required: [profile]
      description: |
        The whole editable content, replacing what was there. Owner, agency, status, member code
        and the profile version can never be set by the client other than as the version last seen.
      properties:
        version:
          type: integer
          minimum: 1
          description: The profile version last seen. Omit only on the very first save.
        profile: { $ref: '#/components/schemas/ProfileContent' }
        contact: { $ref: '#/components/schemas/ContactDetails' }
        preferences: { $ref: '#/components/schemas/PartnerPreferences' }
    OwnProfile:
      type: object
      required: [id, memberCode, status, version, currentDivisionCode, createdAt, updatedAt, data]
      properties:
        id: { type: string, format: uuid }
        memberCode: { type: string, description: 'For example M0483921.' }
        status: { $ref: '#/components/schemas/ProfileStatus' }
        version: { type: integer, description: Rises on every change. }
        currentDivisionCode: { type: [string, 'null'], description: Worked out from the district. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/ProfileData' }
    ProposedChanges:
      type: object
      additionalProperties: false
      description: Only the fields that differ from the published profile.
      properties:
        profile: { type: object, additionalProperties: true }
        contact: { type: object, additionalProperties: true }
        preferences: { type: object, additionalProperties: true }
    ProfileReview:
      type: object
      required:
        [
          id,
          kind,
          status,
          baseProfileVersion,
          proposedChanges,
          reviewerNotes,
          reviewedAt,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [initial_submission, field_update] }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        baseProfileVersion: { type: [integer, 'null'] }
        proposedChanges:
          description: For an initial submission, the whole content; for a field update, only what differs.
          anyOf:
            [
              { $ref: '#/components/schemas/ProposedChanges' },
              { $ref: '#/components/schemas/ProfileData' },
              { type: 'null' },
            ]
        reviewerNotes: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    OwnProfileState:
      type: object
      required: [profile, pendingReview, lastDecision]
      properties:
        profile: { anyOf: [{ $ref: '#/components/schemas/OwnProfile' }, { type: 'null' }] }
        pendingReview: { anyOf: [{ $ref: '#/components/schemas/ProfileReview' }, { type: 'null' }] }
        lastDecision:
          description: The most recent approval or rejection, including the reviewer's note.
          anyOf: [{ $ref: '#/components/schemas/ProfileReview' }, { type: 'null' }]
    ProfileSubmit:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }

    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: A short machine-readable outcome, such as `verification_sent` or `verified`.
    AuthMethods:
      type: object
      required: [password, google, phone, phoneCountries]
      properties:
        password: { type: boolean }
        google: { type: boolean }
        phone: { type: boolean }
        phoneCountries:
          {
            type: array,
            items: { type: string },
            description: Calling codes (without +) whose numbers may be sent a code.,
          }
    ReauthStartInput:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale: { type: string, enum: [bn, en], description: The language of the text message. }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [code, password]
      properties:
        code: { type: string, description: The six digits sent to the account's own phone. }
        password: { type: string, minLength: 10, maxLength: 128 }
    AddEmailStartInput:
      type: object
      additionalProperties: false
      required: [email, code, locale]
      properties:
        email: { type: string, format: email }
        code: { type: string, description: The six digits sent to the account's own phone. }
        locale:
          {
            type: string,
            enum: [bn, en],
            description: The language of the email and of the page its link opens.,
          }
    PhoneStartInput:
      type: object
      additionalProperties: false
      required: [phone, locale, purpose]
      properties:
        phone:
          type: string
          description: A Bangladeshi mobile number (01712345678, 8801712345678, +8801712345678) or any number with its + and country code. Bengali digits are accepted.
        locale: { type: string, enum: [bn, en], description: The language of the text message. }
        purpose: { type: string, enum: [login, register], description: Why the code is wanted. }
    PhoneAttachStartInput:
      type: object
      additionalProperties: false
      required: [phone, locale]
      description: Adding or changing the number of the signed-in account. It takes no purpose, because the code is always for that account.
      properties:
        phone: { type: string }
        locale: { type: string, enum: [bn, en], description: The language of the text message. }
    PhoneVerifyInput:
      type: object
      additionalProperties: false
      required: [phone, code, locale, purpose]
      properties:
        phone: { type: string }
        code: { type: string, description: The six digits (Bengali digits are accepted). }
        purpose:
          {
            type: string,
            enum: [login, register],
            description: The purpose the code was asked for.,
          }
        locale:
          { type: string, enum: [bn, en], description: The language of the pages that follow. }
    PhoneAttachInput:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone: { type: string }
        code: { type: string }
    CodeSent:
      type: object
      required: [status, resendAfter, expiresIn]
      properties:
        status: { type: string, enum: [code_sent] }
        resendAfter: { type: integer, description: Seconds until another code can be asked for. }
        expiresIn: { type: integer, description: Seconds the code works. }
    PendingPhoneSignup:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: The number the code proved, in E.164 form. }
    PhoneSignupInput:
      type: object
      additionalProperties: false
      required: [displayName, password]
      description: |
        `displayName` and `password` are required. The password follows the same rules as any new
        password (10 to 128 characters, not a very common one; problems come back as `tooShort`,
        `tooLong`, `tooWeak`) and may not be the phone number itself (`sameAsPhone`). It is stored
        hashed with the account, so the member can later log in with the number and the password
        and no text message. `acceptTerms` and `acceptPrivacy` must be true, and `confirmAuthority`
        when `onBehalfOfOther` is true; problems come back as the field code `required`. The number
        comes from the proof, never from the request.
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 10, maxLength: 128 }
        acceptTerms: { type: boolean, default: false }
        acceptPrivacy: { type: boolean, default: false }
        onBehalfOfOther: { type: boolean, default: false }
        confirmAuthority: { type: boolean, default: false }
    SignInMethods:
      type: object
      required: [email, emailVerified, phone, hasPassword, google]
      properties:
        email: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        phone: { type: [string, 'null'], description: Partly hidden. }
        hasPassword: { type: boolean }
        google: { type: boolean }
    AuthorizationUrl:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string }
    PendingGoogleLink:
      type: object
      required: [email]
      properties:
        email: { type: string }
    PendingGoogleSignup:
      type: object
      required: [email, name]
      properties:
        email: { type: string }
        name: { type: string }
    GoogleSignupInput:
      type: object
      additionalProperties: false
      description: |
        `acceptTerms` and `acceptPrivacy` must be true, and `confirmAuthority` when
        `onBehalfOfOther` is true; problems come back as the field code `required`.
      properties:
        acceptTerms: { type: boolean, default: false }
        acceptPrivacy: { type: boolean, default: false }
        onBehalfOfOther: { type: boolean, default: false }
        confirmAuthority: { type: boolean, default: false }
    GoogleLinkInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
    GoogleStartInput:
      type: object
      additionalProperties: false
      required: [intent, locale]
      description: |
        Starting a sign-in with Google. Registering needs `acceptTerms` and `acceptPrivacy` to be
        true, and `confirmAuthority` when `onBehalfOfOther` is true; their problems come back as the
        field code `required`. The name and the email come from Google, never from the request.
      properties:
        intent: { type: string, enum: [login, register] }
        locale: { type: string, enum: [bn, en], description: The language the person is reading. }
        acceptTerms: { type: boolean, default: false }
        acceptPrivacy: { type: boolean, default: false }
        onBehalfOfOther: { type: boolean, default: false }
        confirmAuthority: { type: boolean, default: false }
    LinkToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The one-time secret in the emailed link.
    LoginInput:
      type: object
      additionalProperties: false
      required: [password]
      description: Exactly one of `email` and `phone`.
      properties:
        email: { type: string, maxLength: 254, description: Trimmed and lower-cased by the server. }
        phone:
          {
            type: string,
            maxLength: 40,
            description: A Bangladeshi mobile number or any number with its + and country code. Bengali digits are accepted.,
          }
        password: { type: string, minLength: 1, maxLength: 256 }
    ForgotPasswordInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
    ResetPasswordInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        password:
          type: string
          description: |
            10 to 128 characters (counted as a person sees them, so Bengali is not penalised), not a
            very common password, not made of fewer than 5 different characters. Problems come back
            as field codes `tooShort`, `tooLong` and `tooWeak`.
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password, displayName, locale, acceptTerms, acceptPrivacy]
      description: |
        What a new member types to register. A role can never be sent; registration only creates a
        member. The email is proven by the emailed link before the account exists. Field problems
        come back as codes: `required`, `tooLong`, `invalidEmail`, `tooShort`, `tooWeak`,
        `sameAsEmail` (the password is the email or its part before the @), `invalidOption`.
      properties:
        email: { type: string, maxLength: 254, description: Trimmed and lower-cased by the server. }
        password:
          type: string
          description: Same rules as `ResetPasswordInput.password`, and not the email.
        displayName:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: The account holder's own name.,
          }
        locale: { type: string, enum: [bn, en], description: The language the person is reading. }
        acceptTerms: { type: boolean, enum: [true], description: Must be true. }
        acceptPrivacy: { type: boolean, enum: [true], description: Must be true. }
        onBehalfOfOther:
          {
            type: boolean,
            default: false,
            description: Registering for a son,
            daughter,
            sibling or relative.,
          }
        confirmAuthority:
          {
            type: boolean,
            default: false,
            description: Required when registering for someone else.,
          }
    PhotoState:
      type: string
      enum: [waiting, approved, rejected]
      description: Waiting for a reviewer, approved (shown to others) or rejected.
    Photo:
      type: object
      required: [id, state, isPrimary, createdAt, reviewerNotes]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/PhotoState' }
        isPrimary:
          { type: boolean, description: The photo shown first. Only an approved photo can be it. }
        createdAt: { type: string, format: date-time }
        reviewerNotes:
          { type: [string, 'null'], description: The reviewer's note when the photo was rejected. }
    PhotoList:
      type: object
      required: [photos, limit]
      properties:
        photos:
          type: array
          description: In the order the member uploaded them. Removed photos are not listed.
          items: { $ref: '#/components/schemas/Photo' }
        limit: { type: integer, description: How many photos a member may have at once. }

    StaffRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    QueueKind:
      type: string
      enum: [initial_submission, field_update, photo_add, cv_upload]
      description: A new profile, a change to a published profile, a new photo, or a CV waiting for a decision (decided on the client's page, not through the review endpoints).
    QueueStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    ServiceMode:
      type: string
      enum: [self_service, assisted]
      description: A member who runs their own profile, or a client whose profile the agency runs.
    QueueItem:
      type: object
      required: [id, kind, status, createdAt, profile, submittedBy, photoId]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/QueueKind' }
        status: { $ref: '#/components/schemas/QueueStatus' }
        createdAt: { type: string, format: date-time }
        profile:
          type: object
          required: [id, memberCode, fullName, serviceMode, assignedAgentId]
          properties:
            id: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
            serviceMode: { $ref: '#/components/schemas/ServiceMode' }
            assignedAgentId: { type: [string, 'null'], format: uuid }
        submittedBy: { $ref: '#/components/schemas/StaffRef' }
        photoId: { type: [string, 'null'], format: uuid, description: Set for a photo request. }
    QueuePage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }
        next:
          {
            type: [string, 'null'],
            description: Pass as `after` for the next page. Null on the last page.,
          }
    FieldChange:
      type: object
      required: [path, before, after]
      properties:
        path:
          {
            type: string,
            description: For example profile.heightCm. Fields are named as in ProfileInput.,
          }
        before:
          {
            description: The published value,
            or null when nothing was published or the field was empty.,
          }
        after: { description: The proposed value. }
    ReviewDetail:
      allOf:
        - { $ref: '#/components/schemas/QueueItem' }
        - type: object
          required:
            [
              baseProfileVersion,
              reviewerNotes,
              reviewedAt,
              decidedBy,
              profileStatus,
              profileVersion,
              changes,
              stale,
              canDecide,
              blockedBy,
            ]
          properties:
            baseProfileVersion:
              {
                type: [integer, 'null'],
                description: The profile version the request was made against.,
              }
            reviewerNotes: { type: [string, 'null'] }
            reviewedAt: { type: [string, 'null'], format: date-time }
            decidedBy: { anyOf: [{ $ref: '#/components/schemas/StaffRef' }, { type: 'null' }] }
            profileStatus: { type: string }
            profileVersion: { type: integer, description: The version to send back when approving. }
            changes:
              type: array
              description: What the reviewer is asked to look at. Empty for a photo.
              items: { $ref: '#/components/schemas/FieldChange' }
            stale:
              {
                type: boolean,
                description: The profile changed after the request was made,
                so it can no longer be approved.,
              }
            canDecide: { type: boolean }
            blockedBy:
              description: Why it cannot be decided now.
              anyOf:
                - { type: string, enum: [decided, cancelled, stale, own_submission] }
                - { type: 'null' }
    ApproveInput:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }
        profileVersion:
          {
            type: integer,
            minimum: 1,
            description: The version the reviewer looked at. If the profile moved on,
            the approval is refused.,
          }
    RejectInput:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 1000, description: Why. The member sees it. }
    QueueSummary:
      type: object
      required: [pending]
      properties:
        pending: { type: integer }
    CandidateState:
      type: string
      description: |
        proposed: the system suggests it. lapsed: it no longer ranks among the best (it can return).
        released and removed are staff decisions.
      enum: [proposed, lapsed, released, removed]
    CriterionKey:
      type: string
      enum:
        [
          age,
          height,
          religion,
          sect,
          maritalStatus,
          education,
          occupation,
          profession,
          district,
          income,
          familyStatus,
          religiousPractice,
          diet,
          smoking,
          children,
          relocation,
        ]
    CriterionResult:
      type: object
      additionalProperties: false
      required: [key, outcome]
      description: One stated preference and whether the other profile fits it. unknown means it has not answered.
      properties:
        key: { $ref: '#/components/schemas/CriterionKey' }
        outcome: { type: string, enum: [met, unmet, unknown] }
    CandidateItem:
      type: object
      additionalProperties: false
      required:
        [
          candidateId,
          memberCode,
          fullName,
          age,
          professionCode,
          occupationCode,
          currentDistrictCode,
          religionCode,
          maritalStatus,
          profileStatus,
          state,
          met,
          unmet,
          unknown,
          forward,
          reverse,
          proposedAt,
          connection,
        ]
      properties:
        candidateId: { type: string, format: uuid }
        memberCode: { type: string }
        verified: { type: boolean, description: The profile carries the Verified mark. Always present. }
        fullName: { type: string }
        age: { type: [integer, 'null'] }
        professionCode: { type: [string, 'null'] }
        occupationCode: { type: [string, 'null'] }
        currentDistrictCode: { type: [string, 'null'] }
        religionCode: { type: [string, 'null'] }
        maritalStatus: { type: [string, 'null'] }
        profileStatus: { type: string, description: The candidate profile's own status now. }
        state: { $ref: '#/components/schemas/CandidateState' }
        met: { type: integer, description: Criteria met, both directions together. }
        unmet: { type: integer }
        unknown: { type: integer }
        forward:
          type: array
          description: The candidate measured against the client's preferences.
          items: { $ref: '#/components/schemas/CriterionResult' }
        reverse:
          type: array
          description: The client measured against the candidate's own preferences.
          items: { $ref: '#/components/schemas/CriterionResult' }
        proposedAt: { type: string, format: date-time }
        connection:
          description: The proposal between the client and this candidate, if there is one (a withdrawn one does not count). direction says who asked.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [status, direction]
              properties:
                status: { type: string, enum: [in_review, pending, accepted, declined] }
                direction: { type: string, enum: [sent, received] }
    VisibleField:
      type: string
      description: A field of a released profile that staff may show to a client.
      enum:
        [
          fullName,
          age,
          photo,
          aboutMe,
          professionCode,
          occupationCode,
          highestDegreeCode,
          heightCm,
          maritalStatus,
          religionCode,
          currentDistrictCode,
          originDistrictCode,
          monthlyIncomeBandCode,
          familyStatusCode,
          hobbies,
        ]
    ReleaseSettings:
      type: object
      additionalProperties: false
      required: [cap, visibleFields, allowCodeSearch, releasedCount, isDefault]
      properties:
        cap: { type: integer, minimum: 1, maximum: 200 }
        visibleFields:
          type: array
          items: { $ref: '#/components/schemas/VisibleField' }
        allowCodeSearch:
          {
            type: boolean,
            description: The client's filter box has a member code field. Off until staff turn it on.,
          }
        releasedCount:
          { type: integer, description: How many profiles are in the client's window now. }
        isDefault: { type: boolean, description: True when staff have not set anything yet. }
    ReleaseSettingsInput:
      type: object
      additionalProperties: false
      required: [cap, visibleFields]
      properties:
        cap: { type: integer, minimum: 1, maximum: 200 }
        visibleFields:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/VisibleField' }
        allowCodeSearch:
          {
            type: boolean,
            default: false,
            description: Turns on the member code field of the client's filter box.,
          }
    CandidateIdsInput:
      type: object
      additionalProperties: false
      required: [candidateIds]
      properties:
        candidateIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
    CandidateOutcome:
      type: object
      additionalProperties: false
      required: [done, skipped]
      properties:
        done: { type: array, items: { type: string, format: uuid } }
        skipped: { type: array, items: { type: string, format: uuid } }
    MatchItem:
      type: object
      additionalProperties: false
      required: [candidateId, memberCode, verified, connection]
      description: |
        A released profile. Only the fields staff chose are present; every other key is absent.
        Contact details and internal notes are never present.
      properties:
        candidateId: { type: string, format: uuid }
        memberCode: { type: string }
        verified: { type: boolean, description: The profile carries the Verified mark. Always present. }
        fullName: { type: string }
        age: { type: [integer, 'null'] }
        hasPhoto: { type: boolean }
        aboutMe: { type: [string, 'null'] }
        professionCode: { anyOf: [{ $ref: '#/components/schemas/Profession' }, { type: 'null' }] }
        occupationCode: { anyOf: [{ $ref: '#/components/schemas/Occupation' }, { type: 'null' }] }
        highestDegreeCode: { anyOf: [{ $ref: '#/components/schemas/Degree' }, { type: 'null' }] }
        heightCm: { type: [integer, 'null'] }
        maritalStatus: { anyOf: [{ $ref: '#/components/schemas/MaritalStatus' }, { type: 'null' }] }
        religionCode: { anyOf: [{ $ref: '#/components/schemas/Religion' }, { type: 'null' }] }
        currentDistrictCode:
          { anyOf: [{ $ref: '#/components/schemas/District' }, { type: 'null' }] }
        originDistrictCode: { anyOf: [{ $ref: '#/components/schemas/District' }, { type: 'null' }] }
        monthlyIncomeBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        familyStatusCode:
          { anyOf: [{ $ref: '#/components/schemas/FamilyStatus' }, { type: 'null' }] }
        hobbies: { type: [string, 'null'] }
        connection:
          anyOf: [{ $ref: '#/components/schemas/ConnectionSummary' }, { type: 'null' }]
          description: Where a connection with this person stands, from the viewer's side.
    ConnectionSummary:
      type: object
      additionalProperties: false
      required: [id, status, direction]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [in_review, pending, accepted, declined, withdrawn] }
        direction:
          {
            type: string,
            enum: [sent, received],
            description: 'sent: I asked. received: they asked.',
          }
    ProfileDetail:
      type: object
      additionalProperties: false
      required: [profile, connection, contact, visibleFields]
      properties:
        profile: { $ref: '#/components/schemas/MatchItem' }
        connection:
          anyOf:
            - type: object
              additionalProperties: false
              required: [id, status, direction, iSharedContact, theySharedContact]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [in_review, pending, accepted, declined, withdrawn] }
                direction: { type: string, enum: [sent, received] }
                iSharedContact: { type: boolean }
                theySharedContact: { type: boolean }
            - { type: 'null' }
        contact:
          anyOf:
            - type: object
              additionalProperties: false
              required: [name, relationship, phone, email]
              description: What the other person chose to share. Never an address.
              properties:
                name: { type: [string, 'null'] }
                relationship: { type: [string, 'null'] }
                phone: { type: [string, 'null'] }
                email: { type: [string, 'null'] }
            - { type: 'null' }
        visibleFields: { type: array, items: { $ref: '#/components/schemas/VisibleField' } }
    ConnectionRequestInput:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: { type: string, format: uuid }
        note:
          {
            type: string,
            minLength: 1,
            maxLength: 300,
            description: At most 40 words. Shown to the person asked once the request is approved.,
          }
    ConnectionResponseInput:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: { type: string, enum: [accept, decline] }
    ConnectionResult:
      type: object
      additionalProperties: false
      required: [outcome, connectionId, status]
      properties:
        outcome: { type: string, enum: [requested, accepted, unchanged] }
        connectionId: { type: string, format: uuid }
        status: { type: string, enum: [in_review, pending, accepted, declined, withdrawn] }
    ConnectionRow:
      type: object
      additionalProperties: false
      required:
        [
          connectionId,
          status,
          direction,
          createdAt,
          respondedAt,
          iSharedContact,
          theySharedContact,
          note,
          guardianAdvice,
          profile,
        ]
      properties:
        connectionId: { type: string, format: uuid }
        status: { type: string, enum: [in_review, pending, accepted, declined, withdrawn] }
        direction: { type: string, enum: [sent, received] }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: [string, 'null'], format: date-time }
        iSharedContact: { type: boolean }
        theySharedContact: { type: boolean }
        note:
          {
            type: [string, 'null'],
            description: The note the asker added. Present only for the person asked.,
          }
        guardianAdvice:
          anyOf: [{ $ref: '#/components/schemas/GuardianAdvice' }, { type: 'null' }]
        profile: { $ref: '#/components/schemas/MatchItem' }
    ConnectionPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConnectionRow' } }
        next: { type: [string, 'null'] }
    CvInfo:
      type: object
      additionalProperties: false
      required: [id, fileName, byteSize, uploadedAt, uploadedByStaff]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        byteSize: { type: integer, minimum: 1 }
        uploadedAt: { type: string, format: date-time }
        uploadedByStaff: { type: boolean }
    CvReplacement:
      type: object
      additionalProperties: false
      required: [id, fileName, byteSize, uploadedAt, uploadedByStaff, state, reviewerNotes]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        byteSize: { type: integer, minimum: 1 }
        uploadedAt: { type: string, format: date-time }
        uploadedByStaff: { type: boolean }
        state: { type: string, enum: [waiting, rejected] }
        reviewerNotes: { type: [string, 'null'] }
    CvState:
      type: object
      additionalProperties: false
      required: [current, replacement]
      properties:
        current:
          oneOf:
            - { $ref: '#/components/schemas/CvInfo' }
            - { type: 'null' }
        replacement:
          oneOf:
            - { $ref: '#/components/schemas/CvReplacement' }
            - { type: 'null' }
    ReviewParty:
      type: object
      additionalProperties: false
      required: [profileId, memberCode, fullName, age, professionCode, currentDistrictCode]
      properties:
        profileId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        age: { type: [integer, 'null'] }
        professionCode: { type: [string, 'null'] }
        currentDistrictCode: { type: [string, 'null'] }
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [connectionId, createdAt, waitingSince, remindersSent, note, asker, client]
      properties:
        connectionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        waitingSince: { type: string, format: date-time }
        remindersSent: { type: integer, minimum: 0 }
        note: { type: [string, 'null'] }
        asker: { $ref: '#/components/schemas/ReviewParty' }
        client: { $ref: '#/components/schemas/ReviewParty' }
    ReviewRequestPage:
      type: object
      additionalProperties: false
      required: [items, next, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReviewRequest' } }
        next: { type: [string, 'null'] }
        total: { type: integer, minimum: 0 }
    NotificationItem:
      type: object
      additionalProperties: false
      required:
        [id, kind, createdAt, read, connectionId, what, decision, staff, count, chatId, forProfileId, about]
      properties:
        id: { type: string, format: uuid }
        kind:
          {
            type: string,
            enum:
              [
                connection_request,
                connection_accepted,
                connection_declined,
                connection_forwarded,
                contact_shared,
                staff_joined,
                connection_review,
                connection_review_reminder,
                connection_matched,
                connection_unavailable,
                review_requested,
                review_decided,
                candidates_released,
                client_assigned,
                chat_requested,
                chat_accepted,
                chat_message,
                chat_reported,
                chat_invited,
                meeting_update,
                guardian_request,
                guardian_advice,
                guardian_answer,
              ],
          }
        createdAt: { type: string, format: date-time }
        read: { type: boolean, description: The recipient has read this line. }
        connectionId:
          {
            type: [string, 'null'],
            format: uuid,
            description: 'The connection this is about, if it is about one.',
          }
        what:
          {
            type: [string, 'null'],
            description: 'For a review request: profile, edit, photo or cv.',
          }
        decision:
          {
            type: [string, 'null'],
            enum: [approved, rejected, null],
            description: 'For a decision on something sent for review: approved or rejected.',
          }
        chatId: { type: [string, 'null'], format: uuid, description: For a chat line, the conversation. }
        count: { type: [integer, 'null'], description: 'For a release: how many profiles.' }
        staff:
          type: [object, 'null']
          additionalProperties: false
          required: [name, role]
          description: For a staff account that joined, who and as what.
          properties:
            name: { type: string }
            role: { type: string }
        forProfileId:
          {
            type: [string, 'null'],
            format: uuid,
            description: 'The profile this is about for the recipient: their own, or the client they look after. Null for a line that is not about a profile.',
          }
        about:
          type: [object, 'null']
          additionalProperties: false
          required: [profileId, memberCode, fullName]
          properties:
            profileId: { type: string, format: uuid }
            memberCode: { type: string }
            fullName:
              { type: [string, 'null'], description: Null when the recipient may not see names. }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotificationItem' } }
        next: { type: [string, 'null'] }
    StaffConnection:
      type: object
      additionalProperties: false
      required:
        [
          connectionId,
          status,
          direction,
          createdAt,
          respondedAt,
          clientSharedContact,
          otherSharedContact,
          matchedAt,
          guardianAdvice,
          other,
        ]
      properties:
        connectionId: { type: string, format: uuid }
        status: { type: string, enum: [in_review, pending, accepted, declined, withdrawn] }
        direction: { type: string, enum: [sent, received], description: From the client's side. }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: [string, 'null'], format: date-time }
        clientSharedContact: { type: boolean }
        otherSharedContact: { type: boolean }
        matchedAt: { type: [string, 'null'], format: date-time, description: When the connection was marked matched. }
        guardianAdvice:
          anyOf: [{ $ref: '#/components/schemas/GuardianAdvice' }, { type: 'null' }]
        other:
          type: object
          additionalProperties: false
          required:
            [profileId, memberCode, fullName, age, professionCode, currentDistrictCode, serviceMode]
          properties:
            profileId: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
            age: { type: [integer, 'null'] }
            professionCode: { type: [string, 'null'] }
            currentDistrictCode: { type: [string, 'null'] }
            serviceMode: { type: string, enum: [self_service, assisted] }
    StaffConnectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffConnection' } }
    MatchPage:
      type: object
      additionalProperties: false
      required: [items, next, profileStatus, releasedTotal, visibleFields, canSearchByCode]
      properties:
        canSearchByCode:
          {
            type: boolean,
            description: Staff turned on the member code field of this member's filter box.,
          }
        visibleFields:
          type: array
          description: 'The fields staff let this member see: what a card may show and what can be searched.'
          items: { $ref: '#/components/schemas/VisibleField' }
        items: { type: array, items: { $ref: '#/components/schemas/MatchItem' } }
        next: { type: [string, 'null'], description: Pass as after to get the next page. }
        profileStatus:
          anyOf: [{ $ref: '#/components/schemas/ProfileStatus' }, { type: 'null' }]
          description: The member's own profile status, or null when they have none yet.
        releasedTotal:
          { type: integer, description: Profiles released to them in all, whatever the filter. }
    CandidateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CandidateItem' } }
    CandidateGeneration:
      type: object
      additionalProperties: false
      required: [considered, proposed, items]
      properties:
        considered: { type: integer, description: Published profiles that were measured. }
        proposed: { type: integer, description: Proposals saved by this run. }
        items: { type: array, items: { $ref: '#/components/schemas/CandidateItem' } }
    ClientListItem:
      type: object
      required:
        [
          id,
          memberCode,
          fullName,
          status,
          serviceMode,
          version,
          updatedAt,
          assignedAgent,
          districtCode,
          hasPendingReview,
          verified,
        ]
      properties:
        id: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        status: { $ref: '#/components/schemas/ProfileStatus' }
        serviceMode: { $ref: '#/components/schemas/ServiceMode' }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        assignedAgent: { anyOf: [{ $ref: '#/components/schemas/StaffRef' }, { type: 'null' }] }
        districtCode: { type: [string, 'null'] }
        hasPendingReview: { type: boolean }
        verified: { type: boolean }
    ClientPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClientListItem' }
        next: { type: [string, 'null'] }
    ClientMeta:
      type: object
      required: [serviceMode, assignedAgent, owner]
      properties:
        serviceMode: { $ref: '#/components/schemas/ServiceMode' }
        assignedAgent: { anyOf: [{ $ref: '#/components/schemas/StaffRef' }, { type: 'null' }] }
        owner:
          {
            anyOf: [{ $ref: '#/components/schemas/StaffRef' }, { type: 'null' }],
            description: The member who runs a self-service profile. Null for an assisted client.,
          }
    ClientDetail:
      allOf:
        - { $ref: '#/components/schemas/OwnProfileState' }
        - type: object
          required: [client]
          properties:
            client: { $ref: '#/components/schemas/ClientMeta' }
    ClientInput:
      allOf:
        - { $ref: '#/components/schemas/ProfileInput' }
        - type: object
          properties:
            assignedAgentId:
              {
                type: [string, 'null'],
                format: uuid,
                description: "On creation, admins only: who looks after the client. An agent's new client is always theirs.",
              }
    StatusChange:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [active, paused, matched, closed] }
        version: { type: integer, minimum: 1, description: The profile version last seen. }
    AssignmentInput:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId:
          {
            type: [string, 'null'],
            format: uuid,
            description: An active admin or agent,
            or null for nobody.,
          }
    StaffMember:
      type: object
      required: [id, displayName, email, role, status, clientCount]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        role: { type: string, enum: [admin, agent] }
        status: { type: string, enum: [invited, active, disabled] }
        clientCount:
          {
            type: integer,
            minimum: 0,
            description: How many clients are assigned to this person now.,
          }
    AssignmentRecord:
      type: object
      additionalProperties: false
      required: [id, at, from, to, by, reason]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        from:
          oneOf:
            - { $ref: '#/components/schemas/StaffRef' }
            - { type: 'null' }
        to:
          oneOf:
            - { $ref: '#/components/schemas/StaffRef' }
            - { type: 'null' }
        by:
          description: Who made the change. Null for the history kept from before it was recorded.
          oneOf:
            - { $ref: '#/components/schemas/StaffRef' }
            - { type: 'null' }
        reason: { type: string, enum: [assigned, handed_over, earlier, automatic] }
    StaffList:
      type: object
      required: [staff]
      properties:
        staff:
          type: array
          items: { $ref: '#/components/schemas/StaffMember' }

    StaffInviteInput:
      type: object
      additionalProperties: false
      required: [email, displayName, role, locale]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        role: { type: string, enum: [agent, admin] }
        locale:
          type: string
          enum: [bn, en]
          description: The language of the email and of the page its link opens.
    StaffInvitation:
      type: object
      required: [id, email, displayName, role, locale, invitedByName, createdAt, expiresAt, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [agent, admin] }
        locale: { type: string, enum: [bn, en] }
        invitedByName: { type: string, description: The display name of the admin who invited. }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, expired]
          description: '`expired` is an open invitation whose link no longer works.'
    StaffInvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: '#/components/schemas/StaffInvitation' }
    StaffInvitationPreview:
      type: object
      required: [email, displayName, role]
      properties:
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [agent, admin] }
    AcceptStaffInvitationInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The one-time secret in the emailed link.
        password:
          type: string
          description: At least 10 characters, and not the email address.

    GrantClientLoginInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [channel, phone, locale]
          properties:
            channel: { type: string, enum: [sms] }
            phone:
              type: string
              description: A Bangladeshi mobile number (01712345678) or an international one with +.
            locale: { type: string, enum: [bn, en] }
        - type: object
          additionalProperties: false
          required: [channel, email, locale]
          properties:
            channel: { type: string, enum: [email] }
            email: { type: string }
            locale: { type: string, enum: [bn, en] }
      discriminator:
        propertyName: channel

    ClientLoginStatus:
      type: object
      additionalProperties: false
      required: [state, canGrant, channel, address, locale, expiresAt, invitedByName, accountName]
      properties:
        state: { type: string, enum: [none, invited, expired, active] }
        canGrant: { type: boolean }
        channel: { type: [string, 'null'], enum: [sms, email, null] }
        address: { type: [string, 'null'], description: The number or address the link went to. }
        locale: { type: [string, 'null'], enum: [bn, en, null] }
        expiresAt: { type: [string, 'null'], format: date-time }
        invitedByName: { type: [string, 'null'] }
        accountName:
          { type: [string, 'null'], description: The client's account name, once it exists. }

    ClientLoginPreview:
      type: object
      additionalProperties: false
      required: [displayName, channel, locale]
      properties:
        displayName: { type: string }
        channel: { type: string, enum: [sms, email] }
        locale: { type: string, enum: [bn, en] }

    AcceptClientLoginInput:
      type: object
      additionalProperties: false
      required: [token, password, acceptTerms, acceptPrivacy]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The one-time secret in the link.
        password:
          type: string
          description: At least 10 characters.
        acceptTerms: { type: boolean, enum: [true] }
        acceptPrivacy: { type: boolean, enum: [true] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, requestId]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code. Known codes: HOST_INVALID, TENANT_NOT_FOUND,
                BEARER_TOKEN_REQUIRED, INVALID_ACCESS_TOKEN, SESSION_INVALID, SESSION_EXPIRED,
                ACCOUNT_NOT_ACTIVE, ROLE_FORBIDDEN, ORIGIN_INVALID, CSRF_INVALID,
                REFRESH_UNAVAILABLE,
                INVALID_REQUEST, RATE_LIMITED, REQUEST_REJECTED, INTERNAL_ERROR, and for My profile:
                PROFILE_NOT_FOUND, PROFILE_VERSION_CONFLICT, PROFILE_LOCKED,
                PROFILE_EDIT_REQUIRES_REVIEW, PROFILE_STATE_INVALID, PROFILE_INCOMPLETE,
                NO_PENDING_REVIEW, NO_CHANGES, MEMBER_CODE_UNAVAILABLE, and for photos:
                PHOTO_NOT_FOUND, PHOTO_LIMIT_REACHED, PHOTO_NOT_APPROVED, PHOTO_INVALID,
                PHOTO_TYPE_UNSUPPORTED, PHOTO_TOO_SMALL, PAYLOAD_TOO_LARGE,
                UNSUPPORTED_MEDIA_TYPE, and for signing in and email links: INVALID_CREDENTIALS,
                TOO_MANY_ATTEMPTS (with details.retryAfter, seconds), EMAIL_RATE_LIMITED (with
                details.retryAfter, seconds), LINK_INVALID_OR_EXPIRED, and
                for Google: GOOGLE_NOT_CONFIGURED, GOOGLE_UNAVAILABLE, GOOGLE_AUTH_FAILED,
                GOOGLE_EMAIL_UNVERIFIED (Google has not confirmed the email), ACCOUNT_HAS_NO_PASSWORD (the account has no
                password to approve a link with), GOOGLE_ALREADY_LINKED, GOOGLE_RETRY, OAUTH_CHALLENGE_EXPIRED,
                OAUTH_CONTEXT_MISMATCH, and
                for adding an email: EMAIL_ALREADY_SET, PHONE_REQUIRED, EMAIL_IN_USE, and
                for inviting staff: INVITATION_NOT_FOUND (and EMAIL_IN_USE, LINK_INVALID_OR_EXPIRED), and
                for phone codes: PHONE_NOT_CONFIGURED, PHONE_COUNTRY_NOT_SUPPORTED, PHONE_NOT_REGISTERED, CODE_RATE_LIMITED (with details.retryAfter,
                seconds), SMS_UNAVAILABLE, CODE_INVALID, CODE_EXPIRED, PHONE_RETRY, PHONE_IN_USE, and
                for staff: REVIEW_NOT_FOUND, REVIEW_ALREADY_DECIDED, REVIEW_CANCELLED,
                REVIEW_OUT_OF_DATE, REVIEW_OWN_SUBMISSION, PROFILE_SELF_SERVICE,
                STATUS_CHANGE_NOT_ALLOWED, AGENT_NOT_AVAILABLE.
            details:
              type: object
              description: |
                Present on INVALID_REQUEST and PROFILE_INCOMPLETE. Each problem names a field by its
                dotted path (for example `profile.dateOfBirth`) and a stable code the client
                translates: required, tooLong, tooShort, tooWeak, sameAsEmail, invalid, invalidOption,
                invalidDate, underAge, tooOld, outOfRange, invalidPhone, invalidEmail, rangeOrder. Values are never echoed back.
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [path, code]
                    properties:
                      path: { type: string }
                      code: { type: string }
            requestId: { type: string, description: Quote this when reporting a problem. }

  responses:
    Error400:
      description: Invalid host or request (HOST_INVALID, INVALID_REQUEST).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error401:
      description: Not authenticated or session invalid. Sends `WWW-Authenticate Bearer`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error403:
      description: Forbidden (ROLE_FORBIDDEN, ACCOUNT_NOT_ACTIVE, ORIGIN_INVALID, CSRF_INVALID).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TenantNotFound:
      description: The hostname is not a provisioned, active agency (TENANT_NOT_FOUND).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests (RATE_LIMITED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
