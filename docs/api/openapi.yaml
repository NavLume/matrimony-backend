        is final for them. Staff who look after either side.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Reopened. }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'CONNECTION_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CONNECTION_NOT_DECLINED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/connections:
    get:
