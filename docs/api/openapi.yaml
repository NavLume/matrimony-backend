        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Shared. }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND or CONNECTION_NOT_FOUND',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CONNECTION_NOT_ACCEPTED',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/candidates/generate:
    post:
      tags: [Clients]
      summary: Find candidates for a client
      description: |
        Staff only. Measures the agency's published profiles of the other gender against the client's
        partner preferences, and the client against theirs, and saves the best (at most 100) as
        proposals for staff to review. Running again adds and refreshes proposals; what staff already
        released or removed is never touched, and a proposal that no longer ranks among the best
        lapses. A mismatch lowers a candidate but never removes it. Complexion is never used. Nothing
        here is shown to the client. Also runs by itself after staff approve a profile's first
        submission or a change.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The proposals after this run, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateGeneration' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND, also when an agent may not manage the client.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_NOT_PUBLISHED: only a published client can have a list.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'CLIENT_GENDER_REQUIRED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/candidates:
    get:
      tags: [Clients]
      summary: A client's candidate list
      description: Staff only. The candidates in one state, best fit first. No contact details.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/CandidateState' } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 100 },
          }
      responses:
        '200':
          description: The candidates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateList' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND, also when an agent may not manage the client.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/release-settings:
    get:
      tags: [Clients]
      summary: What a client may see
      description: |
        Staff only. The client's cap (how many released profiles their window holds), the fields of a
        released profile they will see, and how full the window is. A client with nothing set yet gets
        the defaults (isDefault is true).
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseSettings' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND, also when an agent may not manage the client.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
    put:
      tags: [Clients]
      summary: Set what a client may see
      description: |
        Staff only. The cap may not go below what is already released (remove some first). Contact
        details and internal notes are not in the list of fields and can never be shown to a client.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseSettingsInput' }
      responses:
        '200':
          description: The settings now in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseSettings' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND, also when an agent may not manage the client.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CAP_BELOW_RELEASED, with details.released.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/candidates/release:
    post:
      tags: [Clients]
      summary: Release candidates to the client
      description: |
        Staff only. Moves proposed candidates into the client's window. Only profiles that are still
        proposed and still published move; the others come back in skipped. If more would move than
        there is room for, nothing moves (CAP_REACHED, with details.cap and details.room).
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateIdsInput' }
      responses:
        '200':
          description: What moved and what did not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateOutcome' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND, also when an agent may not manage the client.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CAP_REACHED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/candidates/remove:
    post:
      tags: [Clients]
      summary: Remove candidates for good
      description: |
        Staff only. Removes proposed, lapsed or released candidates. A removed candidate never comes
        back from a later run and leaves the client's window, freeing a place.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateIdsInput' }
      responses:
        '200':
          description: What was removed and what was not (already removed or unknown).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateOutcome' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND, also when an agent may not manage the client.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/admin/staff:
    get:
      tags: [Clients]
      summary: The staff clients can be handed to
      description: Admins only.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admins and agents of this agency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Clients]
      summary: Create a staff account directly
      description: |
        Admins only. Creates an active account at once with the first password the admin chose, for an
        agency that sets people up in person. The admin tells the person the password; they can change it
        with "Forgot your password". Prefer an invitation, which lets the person choose their own. An
        address that already has an account is refused (409 EMAIL_IN_USE), and a member is never made staff.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, displayName, role, locale, password]
              properties:
                email: { type: string, format: email }
                displayName: { type: string, minLength: 1, maxLength: 100 }
                role: { type: string, enum: [admin, agent] }
                locale: { type: string, enum: [bn, en] }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '201':
          description: The new account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMember' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          {
            description: 'EMAIL_IN_USE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/admin/staff/{accountId}/status:
    put:
      tags: [Clients]
      summary: Turn a staff account off or on
      description: |
        Admins only. A disabled person can no longer sign in, and a session they had stops working on
        its next request. Not your own account (409 CANNOT_DISABLE_SELF), and never the last active admin
        (409 LAST_ADMIN). An invitation that was not accepted is not an account (409 STAFF_NOT_ACCEPTED).
      security:
        - bearerAuth: []
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: The account as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMember' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'STAFF_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CANNOT_DISABLE_SELF, LAST_ADMIN or STAFF_NOT_ACCEPTED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/admin/staff/{accountId}/hand-over:
    post:
      tags: [Clients]
      summary: Hand every client of one agent to another
      description: |
        Admins only. For an agent who is leaving. Every client they look after goes to `toAgentId`, or
        to nobody when it is null. Their waiting requests and reminders follow the client. Each move is
        kept in the client's history.
      security:
        - bearerAuth: []
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toAgentId]
              properties:
                toAgentId: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: How many clients moved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [moved]
                properties:
                  moved: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'STAFF_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'AGENT_NOT_AVAILABLE: the target is not an active staff member, or is the same person.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/login:
    get:
      tags: [Clients]
      summary: Where a client's own login stands
      description: |
        For an admin and the agent who looks after the client. `state` is `none`, `invited` (a link
        is out), `expired` (it was not used in time) or `active` (the client has an account).
        `canGrant` is true for a client the agency runs who has no account.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientLoginStatus' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: CLIENT_NOT_FOUND. }
    post:
      tags: [Clients]
      summary: Send a client a link to their own login
      description: |
        By text message or email, to the number or address the staff member types. Any link still
        out stops working. 30 per 10 minutes, and 3 per address per hour (429 `EMAIL_RATE_LIMITED`).
        The client chooses their own password when they open it; the staff member never sees it.
        409 `CLIENT_HAS_LOGIN` when the client already has an account, `CLIENT_NOT_ASSISTED` when the
        profile is not one the agency runs, `SMS_NOT_AVAILABLE` when no text gateway is set up.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantClientLoginInput' }
      responses:
        '201':
          description: The link was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientLoginStatus' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: CLIENT_NOT_FOUND. }
        '409': { description: CLIENT_HAS_LOGIN, CLIENT_NOT_ASSISTED or SMS_NOT_AVAILABLE. }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Clients]
      summary: Cancel the link that is out
      description: A login that already exists is not touched here. 404 when no link is out.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Cancelled. }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { description: CLIENT_NOT_FOUND or CLIENT_LOGIN_NOT_FOUND. }

  /api/v1/staff/clients/{profileId}/assignments:
    get:
      tags: [Clients]
      summary: Who has looked after a client
      description: Newest first. Admins, and the agent who looks after the client now.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/AssignmentRecord' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/admin/staff/invitations:
    get:
      tags: [Staff]
      summary: Invitations that have not been accepted or cancelled
      description: |
        Admins only. Newest first. `status` is `expired` for an open invitation whose link no longer
        works; it can be sent again.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The open invitations of this agency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitationList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Staff]
      summary: Invite a person to work as an agent or an admin
      description: |
        Admins only, 30 per 10 minutes by address, 30 an hour per admin and 3 an hour per invited
        address. Emails the link (valid 7 days, once). Inviting an address that already has an open
        invitation replaces it: a new link, the old one stops. An address that already has an
        account is 409 `EMAIL_IN_USE`; a member is never turned into staff by an invitation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInviteInput' }
      responses:
        '201':
          description: The invitation, now open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitation' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: EMAIL_IN_USE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/admin/staff/invitations/{invitationId}/resend:
    post:
      tags: [Staff]
      summary: Send an open invitation again with a new link
      description: |
        Admins only. The earlier link stops working and the expiry starts again. 3 an hour per
        invitation. 404 `INVITATION_NOT_FOUND` when it was accepted, cancelled or is unknown.
      security:
        - bearerAuth: []
      parameters:
        - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The invitation with its new expiry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitation' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          description: INVITATION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: EMAIL_IN_USE (the address got an account since).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/admin/staff/invitations/{invitationId}:
    delete:
      tags: [Staff]
      summary: Cancel an open invitation
      description: |
        Admins only. Its link stops working at once. The record is kept. 404
        `INVITATION_NOT_FOUND` when it was accepted, already cancelled or is unknown.
      security:
        - bearerAuth: []
      parameters:
        - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Cancelled.
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          description: INVITATION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The short-lived access token from sign-in or refresh (ES256). Keep it in memory only.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrfToken` from the last token response (43 URL-safe characters).
      schema: { type: string }

  schemas:
    ChatPerson:
      type: object
      additionalProperties: false
      required: [profileId, memberCode, fullName]
      properties:
        profileId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: [string, 'null'], description: Null when the reader may not see names. }
    ChatSummary:
      type: object
      additionalProperties: false
      required: [id, status, endReason, requestedBy, other, requestedAt, acceptedAt, endedAt, lastMessageAt, unread, preview, canSend, chaperones]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested, active, ended] }
        endReason: { type: [string, 'null'], enum: [declined, ended_by_member, blocked, profile_unavailable, ended_by_staff, account_deleted, null] }
        requestedBy: { type: string, enum: [me, them] }
        other: { $ref: '#/components/schemas/ChatPerson' }
        requestedAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        lastMessageAt: { type: [string, 'null'], format: date-time }
        unread: { type: integer }
        preview: { type: [string, 'null'] }
        canSend: { type: boolean, description: Active, chat on for the agency and both profiles published. }
        chaperones:
          type: array
          description: Staff invited into the conversation. Both people see this.
          items:
            type: object
            additionalProperties: false
            required: [accountId, name, invitedByMe]
            properties:
              accountId: { type: string, format: uuid }
              name: { type: string }
              invitedByMe: { type: boolean }
    ChatList:
      type: object
      additionalProperties: false
      required: [enabled, items]
      properties:
        enabled: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/ChatSummary' } }
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, mine, body, masked, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        mine: { type: boolean }
        body: { type: string }
        masked: { type: boolean, description: Something in the text was hidden. }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    ChatMessagePage:
      type: object
      additionalProperties: false
      required: [chat, items, next]
      properties:
        chat: { $ref: '#/components/schemas/ChatSummary' }
        items: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        next: { type: [string, 'null'] }
    StaffChatRow:
      type: object
      additionalProperties: false
      required: [id, status, endReason, other, requestedAt, lastMessageAt, messageCount, openReport, canRead, invited]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested, active, ended] }
        endReason: { type: [string, 'null'] }
        other:
          type: object
          additionalProperties: false
          required: [profileId, memberCode, fullName]
          properties:
            profileId: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
        requestedAt: { type: string, format: date-time }
        lastMessageAt: { type: [string, 'null'], format: date-time }
        messageCount: { type: integer }
        openReport:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, reason, createdAt, byClient]
              properties:
                id: { type: string, format: uuid }
                reason: { type: string }
                createdAt: { type: string, format: date-time }
                byClient: { type: boolean, description: The client of the page made the report, not the other person. }
        canRead: { type: boolean }
        invited: { type: boolean }
    StaffMessagePage:
      type: object
      additionalProperties: false
      required: [chat, people, items, next]
      properties:
        chat:
          type: object
          additionalProperties: false
          required: [id, status, endReason]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [requested, active, ended] }
            endReason: { type: [string, 'null'] }
        people:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [profileId, memberCode, fullName]
            properties:
              profileId: { type: string, format: uuid }
              memberCode: { type: string }
              fullName: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, sender, body, createdAt]
            properties:
              id: { type: string, format: uuid }
              sender: { type: string, format: uuid, description: The profile id of the person who wrote it. }
              body: { type: string }
              createdAt: { type: string, format: date-time }
        next: { type: [string, 'null'] }
    ProposalStatus:
      type: string
      enum: [in_review, pending, accepted, declined, withdrawn]
    AgentReport:
      type: object
      additionalProperties: false
      required: [id, name, role, clients, activeClients, matchedClients, requestsReviewed, averageReviewHours, waitingForReview, collected]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [admin, agent] }
        clients: { type: integer }
        activeClients: { type: integer }
        matchedClients: { type: integer }
        requestsReviewed: { type: integer }
        averageReviewHours: { type: [number, 'null'], description: Hours a request waited for this person's review, on average. }
        waitingForReview: { type: integer }
        collected: { type: integer, description: Whole taka collected in the chosen year. }
    ClientMoney:
      type: object
      additionalProperties: false
      required: [profileId, memberCode, fullName, agentName, agreed, paid]
      properties:
        profileId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        agentName: { type: [string, 'null'] }
        agreed: { type: integer, description: Both stages together, whole taka. }
        paid: { type: integer, description: Payments that are not cancelled. }
    SummaryReport:
      type: object
      additionalProperties: false
      required: [basis, year, years, people, waiting, proposals, funnel, months, agents, money]
      properties:
        basis: { type: string, enum: [fiscal, calendar] }
        year: { type: integer }
        years: { type: array, items: { type: integer } }
        people:
          type: object
          additionalProperties: false
          required: [members, clients, assistedClients, agents, admins, profilesByStatus]
          properties:
            members: { type: integer, description: Accounts of members who sign in. }
            clients: { type: integer, description: Every profile, with or without a login. }
            assistedClients: { type: integer }
            agents: { type: integer }
            admins: { type: integer }
            profilesByStatus: { type: object, additionalProperties: { type: integer } }
        waiting:
          type: object
          additionalProperties: false
          required: [profileReviews, proposalReviews, cvs]
          properties:
            profileReviews: { type: integer }
            proposalReviews: { type: integer }
            cvs: { type: integer }
        proposals:
          type: object
          additionalProperties: false
          required: [total, byStatus, contactShared, bothShared]
          properties:
            total: { type: integer }
            byStatus:
              type: object
              additionalProperties: false
              required: [in_review, pending, accepted, declined, withdrawn]
              properties:
                in_review: { type: integer }
                pending: { type: integer }
                accepted: { type: integer }
                declined: { type: integer }
                withdrawn: { type: integer }
            contactShared: { type: integer, description: Accepted proposals where at least one side shared contact details. }
            bothShared: { type: integer }
        funnel:
          type: object
          additionalProperties: false
          required: [made, accepted, contactShared, matchedClients]
          properties:
            made: { type: integer, description: Proposals not withdrawn. }
            accepted: { type: integer }
            contactShared: { type: integer }
            matchedClients: { type: integer, description: Clients marked as matched. }
        months:
          type: array
          description: The last twelve months, the current one last.
          items:
            type: object
            additionalProperties: false
            required: [month, registrations, proposals, accepted]
            properties:
              month: { type: string, example: '2026-10' }
              registrations: { type: integer }
              proposals: { type: integer }
              accepted: { type: integer }
        agents:
          type: array
          items: { $ref: '#/components/schemas/AgentReport' }
        money:
          type: object
          additionalProperties: false
          required: [yearly, monthly, yearTotals, agreedTotal, paidTotal, clients]
          properties:
            yearly:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [year, total]
                properties:
                  year: { type: integer }
                  total: { type: integer }
            monthly:
              type: array
              description: The twelve months of the chosen year, in order.
              items:
                type: object
                additionalProperties: false
                required: [month, registration, success]
                properties:
                  month: { type: string }
                  registration: { type: integer }
                  success: { type: integer }
            yearTotals:
              type: object
              additionalProperties: false
              required: [registration, success]
              properties:
                registration: { type: integer }
                success: { type: integer }
            agreedTotal: { type: integer, description: All time. }
            paidTotal: { type: integer, description: All time. }
            clients:
              type: array
              description: Clients with an agreement or a payment, most paid first, at most 100.
              items: { $ref: '#/components/schemas/ClientMoney' }
    ProposalSide:
      type: object
      additionalProperties: false
      required: [profileId, memberCode, fullName, gender, agentName]
      properties:
        profileId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        gender: { type: [string, 'null'] }
        agentName: { type: [string, 'null'] }
    ProposalReportRow:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, respondedAt, from, to, fromSharedContact, toSharedContact]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: [string, 'null'], format: date-time }
        from: { $ref: '#/components/schemas/ProposalSide' }
        to: { $ref: '#/components/schemas/ProposalSide' }
        fromSharedContact: { type: boolean }
        toSharedContact: { type: boolean }
    ProposalReportPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProposalReportRow' } }
        next: { type: [string, 'null'] }
    NetworkReport:
      type: object
      additionalProperties: false
      required: [centre, nodes, edges, truncated]
      properties:
        centre: { type: [string, 'null'], format: uuid }
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [profileId, memberCode, fullName, gender]
            properties:
              profileId: { type: string, format: uuid }
              memberCode: { type: string }
              fullName: { type: string }
              gender: { type: [string, 'null'] }
        edges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, from, to, status]
            properties:
              id: { type: string, format: uuid }
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/ProposalStatus' }
        truncated: { type: boolean }
    PaymentRow:
      type: object
      additionalProperties: false
      required: [id, stage, amount, paidOn, method, reference, note, connection, receivedBy, createdAt, invoice, voided]
      properties:
        id: { type: string, format: uuid }
        stage: { type: string, enum: [registration, success] }
        amount: { type: integer, description: Whole taka. }
        paidOn: { type: string, format: date }
        method: { type: string, enum: [cash, bank, bkash, other] }
        reference: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        connection:
          description: The accepted proposal a success fee came from.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, memberCode, fullName]
              properties:
                id: { type: string, format: uuid }
                memberCode: { type: string }
                fullName: { type: string }
        receivedBy: { type: string, description: The staff member who recorded it. }
        createdAt: { type: string, format: date-time }
        invoice:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [name, mime, size]
              properties:
                name: { type: string }
                mime: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                size: { type: integer }
        voided:
          description: Set when an admin cancelled it. The reason is null for a member.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [at, reason]
              properties:
                at: { type: string, format: date-time }
                reason: { type: [string, 'null'] }
    PaymentStageSummary:
      type: object
      additionalProperties: false
      required: [agreed, paid, balance]
      properties:
        agreed: { type: [integer, 'null'], description: The amount agreed. Null while none is set. }
        paid: { type: integer, description: Payments that are not cancelled. }
        balance: { type: [integer, 'null'], description: Agreed less paid. Null while nothing is agreed. }
    DocumentType:
      type: string
      enum: [nid, passport, birth_certificate, driving_license]
    VerificationState:
      type: object
      additionalProperties: false
      required: [verified, request]
      properties:
        verified:
          anyOf:
            - type: object
              additionalProperties: false
              required: [at]
              properties:
                at: { type: string, format: date-time }
            - type: 'null'
        request:
          anyOf:
            - type: object
              additionalProperties: false
              required: [id, docType, status, submittedAt, decidedAt, note, hasFile]
              properties:
                id: { type: string, format: uuid }
                docType: { $ref: '#/components/schemas/DocumentType' }
                status: { type: string, enum: [pending, approved, rejected, withdrawn] }
                submittedAt: { type: string, format: date-time }
                decidedAt: { type: [string, 'null'], format: date-time }
                note: { type: [string, 'null'] }
                hasFile: { type: boolean }
            - type: 'null'
    VerificationWaiting:
      type: object
      additionalProperties: false
      required: [id, profile, docType, submittedAt, submittedBy]
      properties:
        id: { type: string, format: uuid }
        profile:
          type: object
          additionalProperties: false
          required: [id, memberCode, fullName]
          properties:
            id: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
        docType: { $ref: '#/components/schemas/DocumentType' }
        submittedAt: { type: string, format: date-time }
        submittedBy: { type: string }
    MeetingKind:
      type: string
      enum: [first_meeting, family_meeting, visit, call, other]
    MeetingInput:
      type: object
      additionalProperties: false
      required: [scheduledAt, kind]
      properties:
        scheduledAt: { type: string, format: date-time, description: With a time zone offset. }
        kind: { $ref: '#/components/schemas/MeetingKind' }
        place: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 500 }
    MeetingPerson:
      type: object
      additionalProperties: false
      required: [profileId, memberCode, fullName, managed, feedback]
      properties:
        profileId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        managed: { type: boolean, description: The staff member looks after this side; only then is feedback present. }
        feedback:
          anyOf:
            - type: object
              additionalProperties: false
              required: [verdict, note, recordedAt]
              properties:
                verdict: { type: string, enum: [interested, undecided, not_interested] }
                note: { type: [string, 'null'] }
                recordedAt: { type: string, format: date-time }
            - type: 'null'
    MeetingRow:
      type: object
      additionalProperties: false
      required: [id, connectionId, scheduledAt, kind, place, note, status, createdBy, awaitingOutcome, canRespond, people]
      properties:
        id: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/MeetingKind' }
        place: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [proposed, scheduled, done, cancelled] }
        createdBy: { type: string }
        awaitingOutcome: { type: boolean, description: Still scheduled although its time has passed. }
        canRespond: { type: boolean, description: Proposed by the other side; this staff member may confirm it or suggest another time. }
        people:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/MeetingPerson' }
    MemberMeeting:
      type: object
      additionalProperties: false
      required: [id, canRespond, scheduledAt, kind, place, note, status, other]
      properties:
        id: { type: string, format: uuid }
        canRespond: { type: boolean, description: Proposed by the other side; the client may confirm it or suggest another time. }
        scheduledAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/MeetingKind' }
        place: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [proposed, scheduled, done, cancelled] }
        other:
          type: object
          additionalProperties: false
          required: [profileId, memberCode, fullName]
          properties:
            profileId: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
    NoteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, body, author, createdAt]
            properties:
              id: { type: string, format: uuid }
              body: { type: string }
              author: { type: string }
              createdAt: { type: string, format: date-time }
    FollowUp:
      type: object
      additionalProperties: false
      required: [id, profile, dueOn, text, assignedTo, due, done]
      properties:
        id: { type: string, format: uuid }
        profile:
          type: object
          additionalProperties: false
          required: [id, memberCode, fullName]
          properties:
            id: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
        dueOn: { type: string, format: date }
        text: { type: string }
        assignedTo: { type: string }
        due: { type: boolean, description: Due today or earlier (Bangladesh time) and not done. }
        done:
          anyOf:
            - type: object
              additionalProperties: false
              required: [at, by]
              properties:
                at: { type: string, format: date-time }
                by: { type: string }
            - type: 'null'
    FollowUpList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FollowUp' }
    Agenda:
      type: object
      additionalProperties: false
      required: [meetings, followUps, attention]
      properties:
        meetings:
          type: array
          items: { $ref: '#/components/schemas/MeetingRow' }
        followUps:
          type: array
          items: { $ref: '#/components/schemas/FollowUp' }
        attention: { type: integer, description: Overdue follow-ups plus meetings waiting for an outcome. }
    GuardianInvite:
      type: object
      additionalProperties: false
      required: [email, displayName, locale]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        locale: { type: string, enum: [bn, en] }
        clientAgreed: { type: boolean, description: For a client with no login, the agent confirms the client agreed. }
    GuardianState:
      type: object
      additionalProperties: false
      required: [state, displayName, email, expiresAt, consentBasis, consentedAt, clientHasLogin]
      properties:
        state: { type: string, enum: [none, awaiting_client, invited, expired, active] }
        displayName: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        consentBasis: { type: [string, 'null'], enum: [client_in_app, agent_recorded, null] }
        consentedAt: { type: [string, 'null'], format: date-time }
        clientHasLogin: { type: boolean }
    GuardianPreview:
      type: object
      additionalProperties: false
      required: [displayName, clientName, locale]
      properties:
        displayName: { type: string }
        clientName: { type: string }
        locale: { type: string, enum: [bn, en] }
    WardSummary:
      type: object
      additionalProperties: false
      required: [profileId, memberCode, fullName]
      properties:
        profileId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
    GuardianAdvice:
      type: object
      additionalProperties: false
      required: [advice, note, at]
      properties:
        advice: { type: string, enum: [supportive, concerned] }
        note: { type: [string, 'null'] }
        at: { type: string, format: date-time }
    CancelledPayment:
      type: object
      additionalProperties: false
      required: [id, profile, agentName, stage, amount, paidOn, method, receivedBy, cancelledAt, cancelledBy, reason, hasInvoice]
      properties:
        id: { type: string, format: uuid }
        profile:
          type: object
          additionalProperties: false
          required: [id, memberCode, fullName]
          properties:
            id: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
        agentName: { type: [string, 'null'] }
        stage: { type: string, enum: [registration, success] }
        amount: { type: integer, description: Whole taka. }
        paidOn: { type: string, format: date }
        method: { type: string }
        receivedBy: { type: string }
        cancelledAt: { type: string, format: date-time }
        cancelledBy: { type: string }
        reason: { type: string }
        hasInvoice: { type: boolean }
    CancelledPage:
      type: object
      additionalProperties: false
      required: [items, next, totals]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CancelledPayment' }
        next: { type: [string, 'null'] }
        totals:
          type: object
          additionalProperties: false
          required: [count, amount]
          properties:
            count: { type: integer }
            amount: { type: integer }
    SuccessSide:
      type: object
      additionalProperties: false
      required: [profileId, memberCode, fullName, status, agentName, verified, registration, success]
      properties:
        profileId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        status: { type: string }
        agentName: { type: [string, 'null'] }
        verified: { type: boolean }
        registration:
          type: object
          additionalProperties: false
          required: [agreed, paid]
          properties:
            agreed: { type: integer }
            paid: { type: integer }
        success:
          type: object
          additionalProperties: false
          required: [agreed, paid]
          properties:
            agreed: { type: integer }
            paid: { type: integer }
    SuccessfulConnection:
      type: object
      additionalProperties: false
      required: [id, sentAt, connectedAt, daysToAccept, a, b, contactShared, matched, matchedAt, story, meetings, successFeeForThis, bothPaid, bothAgreed]
      properties:
        id: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }
        connectedAt: { type: string, format: date-time }
        daysToAccept: { type: integer }
        a: { $ref: '#/components/schemas/SuccessSide' }
        b: { $ref: '#/components/schemas/SuccessSide' }
        contactShared:
          type: object
          additionalProperties: false
          required: [a, b]
          properties:
            a: { type: boolean }
            b: { type: boolean }
        matched: { type: boolean, description: At least one of the two clients is marked matched. }
        matchedAt: { type: [string, 'null'], format: date-time, description: When the connection itself was marked matched. }
        story:
          anyOf:
            - type: object
              additionalProperties: false
              required: [id, status, consentBoth]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [draft, published, hidden] }
                consentBoth: { type: boolean }
            - type: 'null'
        meetings:
          type: object
          additionalProperties: false
          required: [total, done, last]
          properties:
            total: { type: integer, description: Not counting cancelled ones. }
            done: { type: integer }
            last: { type: [string, 'null'], format: date-time }
        successFeeForThis: { type: integer, description: Success-fee payments recorded for this very connection. }
        bothPaid: { type: integer }
        bothAgreed: { type: integer }
    SuccessfulPage:
      type: object
      additionalProperties: false
      required: [items, next, totals]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SuccessfulConnection' }
        next: { type: [string, 'null'] }
        totals:
          type: object
          additionalProperties: false
          required: [connections, matched, successFeeCollected]
          properties:
            connections: { type: integer }
            matched: { type: integer }
            successFeeCollected: { type: integer }
    MarkMatchedInput:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 500 }
        fees:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [profileId, amount]
            properties:
              profileId: { type: string, format: uuid }
              amount: { type: integer, minimum: 0, description: The success fee in whole taka. }
        story:
          type: object
          additionalProperties: false
          required: [names, text]
          properties:
            names:
              type: object
              additionalProperties: false
              properties:
                bn: { type: string, maxLength: 120 }
                en: { type: string, maxLength: 120 }
            text:
              type: object
              additionalProperties: false
              properties:
                bn: { type: string, maxLength: 1500 }
                en: { type: string, maxLength: 1500 }
            year: { type: integer }
            consentFrom:
              type: array
              maxItems: 2
              items: { type: string, format: uuid }
              description: The clients who agreed to a story. Both are needed before it can be published.
    ActivityItem:
      type: object
      additionalProperties: false
      required: [id, type, at, actor, subject, profileId]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: The event's name, such as payment.voided. }
        at: { type: string, format: date-time }
        actor:
          anyOf:
            - type: object
              additionalProperties: false
              required: [id, name, role]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                role: { type: string }
            - type: 'null'
        subject: { type: [string, 'null'], description: What it was about, in words, when it can be told. }
        profileId: { type: [string, 'null'], format: uuid }
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityItem' }
        next: { type: [string, 'null'] }
    PaymentLedger:
      type: object
      additionalProperties: false
      required: [profile, stages, payments]
      properties:
        profile:
          type: object
          additionalProperties: false
          required: [id, memberCode, fullName]
          properties:
            id: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
        stages:
          type: object
          additionalProperties: false
          required: [registration, success]
          properties:
            registration: { $ref: '#/components/schemas/PaymentStageSummary' }
            success: { $ref: '#/components/schemas/PaymentStageSummary' }
        payments:
          type: array
          description: Newest first, cancelled ones included.
          items: { $ref: '#/components/schemas/PaymentRow' }
    Tenant:
      type: object
      required: [id, name, locale, content]
      properties:
        id: { type: string }
        name: { type: string }
        locale: { type: string, enum: [bn, en] }
        content: { $ref: '#/components/schemas/PublicConfig' }

    LocalizedText:
      type: object
      description: Text in one or both languages. A reader sees their own language, else the other.
      properties:
        bn: { type: string, maxLength: 2000 }
        en: { type: string, maxLength: 2000 }

    PublicConfig:
      type: object
      description: The agency's non-secret public settings. Every field is optional; unknown fields are ignored.
      properties:
        name:
          type: string
          description: Display name of the agency. Falls back to the agency's `name`.
        branding:
          type: object
          properties:
            logoUrl:
              type: string
              description: An `https://` URL or a path starting with `/`. Anything else is ignored.
            primaryColor:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
              description: Main brand color as `#RRGGBB`. It reaches CSS, so nothing else is accepted.
            accentColor:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
              description: The second colour of the look (gold in the classic theme), as `#RRGGBB`.
            theme:
              type: string
              enum: [classic, modern, warm, royal]
              description: The complete look. Missing means classic.
        contact:
          type: object
          properties:
            phone: { type: string, maxLength: 40 }
            email: { type: string, maxLength: 200 }
        home:
          type: object
          description: Optional homepage copy that replaces the platform's default wording, and the order and visibility of the parts below the first screen.
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            subtitle: { $ref: '#/components/schemas/LocalizedText' }
            sections:
              type: array
              maxItems: 7
              description: Parts of the home page in the order to show them. A part not listed shows in its default place; the first screen always comes first.
              items: { $ref: '#/components/schemas/HomeSection' }
        auth:
          type: object
          description: The side panel of the sign-in and registration pages.
          properties:
            headline: { $ref: '#/components/schemas/LocalizedText' }
            text: { $ref: '#/components/schemas/LocalizedText' }
            scene: { type: boolean, description: Whether the village scene shows (default true). }
        about: { $ref: '#/components/schemas/LocalizedText' }
        branches:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Branch' }
        successStories:
          type: array
          maxItems: 12
          description: The stories an admin published (newest first), then any typed in by the operator.
          items: { $ref: '#/components/schemas/SuccessStory' }

    LegalInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: object
          additionalProperties: false
          properties:
            bn: { type: string, maxLength: 200 }
            en: { type: string, maxLength: 200 }
        body:
          type: object
          additionalProperties: false
          description: Plain text. A line starting with `## ` is a heading, a line starting with `- ` a list item, a blank line separates paragraphs.
          properties:
            bn: { type: string, maxLength: 40000 }
            en: { type: string, maxLength: 40000 }

    LegalDocument:
      type: object
      required: [kind, version]
      properties:
        kind: { type: string, enum: [terms, privacy] }
        version: { type: integer }
        title: { $ref: '#/components/schemas/LocalizedText' }
        body: { $ref: '#/components/schemas/LocalizedText' }
        createdAt: { type: string, format: date-time }

    PublicLegal:
      type: object
      required: [kind, version, custom]
      properties:
        kind: { type: string, enum: [terms, privacy] }
        version: { type: string, description: The version a registration records (`agency-vN` or the platform draft's). }
        custom: { type: boolean }
        title: { $ref: '#/components/schemas/LocalizedText' }
        body: { $ref: '#/components/schemas/LocalizedText' }

    HomeSection:
      type: object
      required: [id]
      properties:
        id: { type: string, enum: [village, how, why, trust, stories, agency, final] }
        visible: { type: boolean, description: False hides the part (default true). }
        title: { $ref: '#/components/schemas/LocalizedText' }
        text: { $ref: '#/components/schemas/LocalizedText' }
        items:
          type: array
          maxItems: 4
          description: Words for the part's cards, steps or points, by position; an empty one keeps the default.
          items:
            type: object
            properties:
              title: { $ref: '#/components/schemas/LocalizedText' }
              text: { $ref: '#/components/schemas/LocalizedText' }

    SiteContentInput:
      type: object
      additionalProperties: false
      properties:
        contact:
          type: object
          additionalProperties: false
          properties:
            phone: { type: string, maxLength: 40 }
            email: { type: string, maxLength: 200 }
        home:
          type: object
          additionalProperties: false
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            subtitle: { $ref: '#/components/schemas/LocalizedText' }
            sections:
              type: array
              maxItems: 7
              items: { $ref: '#/components/schemas/HomeSection' }
        auth:
          type: object
          additionalProperties: false
          properties:
            headline: { $ref: '#/components/schemas/LocalizedText' }
            text: { $ref: '#/components/schemas/LocalizedText' }
            scene: { type: boolean }
        about: { $ref: '#/components/schemas/LocalizedText' }
        branches:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Branch' }

    SiteContent:
      type: object
      required: [branding, contact, home, auth, branches, publishedStories]
      properties:
        branding:
          type: object
          required: [name]
          properties:
            name: { type: string, description: The name shown on the site; the agency's own name when none was set. }
            primaryColor: { type: string }
            accentColor: { type: string }
            theme: { type: string, enum: [classic, modern, warm, royal] }
            logoUrl: { type: string }
        contact:
          type: object
          properties:
            phone: { type: string }
            email: { type: string }
        home:
          type: object
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
