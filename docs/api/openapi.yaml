  /api/v1/staff/clients/{profileId}/cv/review:
    post:
      tags: [CV]
      summary: Approve or turn down a waiting CV
      description: |
        Approving publishes the replacement and retires the CV that was published. Turning it down
        keeps the published CV and shows the member the note.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                notes: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The new state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
