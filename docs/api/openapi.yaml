  /api/v1/staff/connection-reviews:
    get:
      tags: [Connections]
      summary: Requests waiting for my review
      description: |
        Requests to members with a login that wait for review, longest waiting first. An admin sees
        every request; an agent only those for the clients assigned to them. `total` is how many wait in
        all, for the badge. The first reminder goes out after 2 days, each later one every 3.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: after, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequestPage' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/staff/connections/{connectionId}/review:
    post:
      tags: [Connections]
      summary: Approve or reject a request
      description: |
        Approving shows the request to the person asked. Rejecting ends it as declined, which is what
        the asker is told. Only the agent who looks after the person asked, or an admin.
      security:
        - bearerAuth: []
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        '204': { description: Decided. }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'CONNECTION_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'CONNECTION_NOT_IN_REVIEW: already decided or taken back.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/connections/{connectionId}/reopen:
    post:
      tags: [Connections]
      summary: Reopen a declined pair
      description: |
